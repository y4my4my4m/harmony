# Supabase CLI project file.
#
# Only the migration workflow is used. The CLI is pointed at a database with
# --db-url, so nothing here needs a cloud project and `supabase link` is not
# part of the deployment path:
#
#   npx supabase@2.83.0 migration list --db-url "$DATABASE_URL"
#   npx supabase@2.83.0 db push --dry-run --db-url "$DATABASE_URL"
#   npx supabase@2.83.0 db push          --db-url "$DATABASE_URL"
#
# The version is named at the call site rather than held in package.json: no build step or CI
# job runs the CLI, and as a dependency its postinstall downloads a release binary on every
# `npm ci`, which fails the job when that fetch resets. Versions differ in the flags they
# accept and the SQL they emit, so a bare `supabase` picking up a global binary is not
# equivalent.
#
# supabase/migrations is a symlink to db_schema/migrations, which stays the
# single source of truth alongside db_schema/init. The CLI reads through the
# symlink; keeping the files where they are leaves the drift gate and the docs
# pointing at the same paths they always did.
#
# Migration filenames must be <version>_<name>.sql with a version unique across
# the whole directory - supabase_migrations.schema_migrations has version as its
# primary key. The repo uses YYYYMMDDNNNNNN, the counter ordering files created
# on the same day.
project_id = "harmony"

# Deployed engine is 15.8. Absent this, the CLI raises a 17.x shadow and its pg_dump emits
# `SET transaction_timeout = 0`, which 15 rejects with 42704 - so anything it generates is
# unloadable on the instances it is generated for.
[db]
major_version = 15
