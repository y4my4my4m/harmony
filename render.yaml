# =============================================================================
# Render Blueprint - Harmony Backend Services
# =============================================================================
# Deploy the Harmony backend to Render with one click.
#
# This deploys:
#   - Federation Backend (ActivityPub, link previews, WebRTC signaling)
#   - Redis (for caching)
#   - Bot Gateway (optional, uncomment to enable)
#
# Prerequisites:
#   - Supabase Cloud project (for database)
#   - LiveKit Cloud account (for voice/video, optional)
#   - Resend account (for email, optional)
#
# After deployment:
#   1. Deploy frontend to Vercel separately
#   2. Configure environment variables
#   3. Run database schema in Supabase SQL Editor
#
# One-Click Deploy:
#   https://render.com/deploy?repo=https://github.com/YOUR_USERNAME/harmony
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Federation Backend
  # ---------------------------------------------------------------------------
  # Handles ActivityPub federation, link previews, and WebRTC token generation
  - type: web
    name: harmony-federation
    runtime: node
    region: oregon  # Change to your preferred region
    plan: starter   # $7/mo - required for always-on (free tier sleeps)
    # Build federation-backend (add bot-gateway if using combined mode)
    buildCommand: cd federation-backend && npm ci && npm run build
    # Standard: federation only
    startCommand: cd federation-backend && npm start
    # Combined mode (uncomment to also run bot-gateway on same instance):
    # buildCommand: cd federation-backend && npm ci && npm run build && cd ../bot-gateway && npm ci && npm run build
    # startCommand: npx concurrently "cd federation-backend && npm start" "cd bot-gateway && npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Supabase (set these in Render dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Instance configuration
      - key: INSTANCE_DOMAIN
        sync: false  # Set to your domain
      - key: INSTANCE_NAME
        value: Harmony
      - key: INSTANCE_DESCRIPTION
        value: A federated social platform
      # CORS - set to your Vercel frontend URL
      - key: CORS_ORIGIN
        sync: false
      # pg-boss queue (uses DATABASE_URL from Supabase)
      - key: USE_PGBOSS_QUEUE
        value: "true"
      - key: DATABASE_URL
        sync: false  # Set to Supabase connection string
      # Redis (from internal service below)
      - key: REDIS_URL
        fromService:
          name: harmony-redis
          type: redis
          property: connectionString
      # LiveKit (optional - set in dashboard if using voice)
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      # Email/SMTP (optional - Resend recommended)
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false  # Set to Resend API key
      - key: SMTP_FROM
        sync: false  # Set to your sender email
      - key: SMTP_SECURE
        value: "true"

  # ---------------------------------------------------------------------------
  # Redis (for caching and rate limiting)
  # ---------------------------------------------------------------------------
  - type: redis
    name: harmony-redis
    region: oregon
    plan: free      # Free tier is fine for Redis
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Only internal access

  # ---------------------------------------------------------------------------
  # Bot Gateway (Optional - Two Options)
  # ---------------------------------------------------------------------------
  # 
  # OPTION A: Run combined with federation-backend (saves $7/mo)
  #   - Change federation-backend startCommand to run both:
  #     startCommand: npx concurrently "cd federation-backend && npm start" "cd bot-gateway && npm start"
  #   - Both run on same instance, different internal ports
  #   - Use nginx/caddy to route, or just expose federation on main port
  #
  # OPTION B: Separate service (uncomment below)
  #   - More resources, easier scaling
  #   - Additional ~$7/mo
  #
  # - type: web
  #   name: harmony-bot-gateway
  #   runtime: node
  #   region: oregon
  #   plan: starter  # $7/mo
  #   buildCommand: cd bot-gateway && npm ci && npm run build
  #   startCommand: cd bot-gateway && npm start
  #   healthCheckPath: /health
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: PORT
  #       value: 3002
  #     - key: SUPABASE_URL
  #       sync: false
  #     - key: SUPABASE_SERVICE_ROLE_KEY
  #       sync: false
  #     - key: INSTANCE_DOMAIN
  #       sync: false
  #     - key: REDIS_URL
  #       fromService:
  #         name: harmony-redis
  #         type: redis
  #         property: connectionString

