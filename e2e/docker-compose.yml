# Ephemeral stack for E2E runs. No secrets: every credential is generated by
# stack.sh at bring-up and lives in e2e/stack.env.
#
# Covers db + auth + rest. Storage, realtime, imgproxy and meta are absent; see
# stack.sh for what that costs.
#
# Driven by e2e/stack.sh, which orders bring-up around the schema build.
# `docker compose up` on its own leaves an empty database.

name: hme2e

services:
  # Same image and version the pgTAP suite builds against (scripts/run-db-tests.sh).
  db:
    image: ${E2E_PG_IMAGE:-supabase/postgres:15.8.1.060}
    environment:
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-unset}
    healthcheck:
      # Over TCP, not the socket: the image's init phase runs a socket-only
      # server, and a socket probe reports healthy while the port is still shut.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 45
    # No published port. psql reaches it through `docker compose exec`.

  # Runs its own migrations against the auth schema on start. The image's auth
  # schema stops at 20180125194653; GoTrue carries it forward.
  auth:
    image: ${E2E_GOTRUE_IMAGE:-supabase/gotrue:v2.182.1}
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${E2E_PORT:-54480}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${E2E_DB_PASSWORD:-unset}@db:5432/postgres?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${E2E_JWT_SECRET:-unset}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      # RLS reads auth.uid() from the sub claim and auth.role() from role.
      # GoTrue writes role from this setting; anything else and every
      # authenticated policy evaluates as the wrong role.
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # No SMTP in the stack; sign-up must confirm inline or no session is issued.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      # Defaults are tuned for a public instance and a test loop trips them.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "10000"
      GOTRUE_RATE_LIMIT_VERIFY: "10000"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "10000"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "10000"
      GOTRUE_LOG_LEVEL: info

  rest:
    image: ${E2E_POSTGREST_IMAGE:-postgrest/postgrest:v13.0.7}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${E2E_DB_PASSWORD:-unset}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${E2E_JWT_SECRET:-unset}
      PGRST_LOG_LEVEL: error
      # v13 has no db-use-legacy-gucs; claims arrive only as the
      # request.jwt.claims JSON GUC. e2e/jwt-claims-compat.sql teaches
      # auth.uid() to read it.

  # supabase-js addresses one origin and splits by path prefix. Kong does this
  # in the real stack; nginx does it here without a declarative config to keep
  # in step.
  gateway:
    image: ${E2E_NGINX_IMAGE:-nginx:alpine}
    depends_on:
      - auth
      - rest
    ports:
      - "${E2E_PORT:-54480}:8000"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cors.inc:/etc/nginx/conf.d/cors.inc:ro
