# Path split supabase-js expects. Only /rest/v1 is backed here; the federation
# backend uses no other Supabase surface in this run.
#
# The upstream name goes through a variable so nginx resolves it per request;
# named directly it is resolved once at start and a container that is not up
# yet kills the config load.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    client_max_body_size 10m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/rest/v1/(.*)$ {
        set $upstream_rest rest;
        proxy_pass http://$upstream_rest:3000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime is absent. VoiceActivityHandler broadcasts an incoming call
    # after writing the row and ignores the result; 501 names the gap instead
    # of a 404 that reads like a missing route in the backend.
    location ~ ^/(auth|storage|realtime|functions)/v1/ {
        add_header Content-Type application/json always;
        return 501 '{"message":"not in the federation e2e stack: auth, storage, realtime and functions are absent"}';
    }
}
