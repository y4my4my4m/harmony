# Ephemeral Postgres + PostgREST stack for the federation round-trip run.
# Separate project and port from e2e/docker-compose.yml so both can be up at
# once. No secrets: stack.sh generates every credential into
# e2e/federation/stack.env at bring-up.
#
# GoTrue is absent. The federation backend reaches the database as
# service_role with a static JWT. User tokens are HS256 JWTs roundtrip.ts
# signs itself; gateway.conf answers /auth/v1/user from them.
#
# LiveKit serves the voice round trips: both instances' rooms live on it, and
# roundtrip.ts joins each issued token over its signalling WebSocket. No media
# crosses it; the RTC ports stay unpublished.
#
# The default network carries an explicit subnet from RFC 5737 TEST-NET-3.
# The bridge gateway address (.1) is an address on the host, and the federation
# backend's SSRF guard rejects loopback, RFC 1918 and link-local destinations -
# so a peer inbox served from the host is only reachable by federation code
# through this address. roundtrip.ts binds its peer there.

name: hmfed

networks:
  default:
    ipam:
      config:
        - subnet: ${HMFED_SUBNET:-203.0.113.0/24}

services:
  # Same image the pgTAP suite and e2e/docker-compose.yml build against.
  db:
    image: ${HMFED_PG_IMAGE:-supabase/postgres:15.8.1.060}
    environment:
      POSTGRES_PASSWORD: ${HMFED_DB_PASSWORD:-unset}
    healthcheck:
      # Over TCP, not the socket: the image's init phase runs a socket-only
      # server, and a socket probe reports healthy while the port is still shut.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 45
    # No published port. psql reaches it through `docker exec`.

  rest:
    image: ${HMFED_POSTGREST_IMAGE:-postgrest/postgrest:v13.0.7}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${HMFED_DB_PASSWORD:-unset}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${HMFED_JWT_SECRET:-unset}
      PGRST_LOG_LEVEL: error

  livekit:
    image: ${HMFED_LIVEKIT_IMAGE:-livekit/livekit-server:v1.9.4}
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50010
          use_external_ip: false
        keys:
          ${HMFED_LIVEKIT_KEY:-unset}: ${HMFED_LIVEKIT_SECRET:-unset}
        logging:
          level: warn
    ports:
      - "127.0.0.1:${HMFED_LIVEKIT_PORT:-54581}:7880"

  # supabase-js addresses one origin and splits by path prefix.
  gateway:
    image: ${HMFED_NGINX_IMAGE:-nginx:alpine}
    depends_on:
      - rest
    ports:
      - "${HMFED_PORT:-54580}:8000"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
