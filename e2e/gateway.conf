# Path split supabase-js expects: /auth/v1 -> GoTrue, /rest/v1 -> PostgREST,
# /storage/v1 -> storage-api.
# Upstreams go through variables to force per-request resolution; a literal
# name is resolved at load and fails the config while its container is down.

resolver 127.0.0.11 valid=10s ipv6=off;

# Sb-Forwarded-For is the client address a real proxy overwrites it with: $remote_addr behind
# nginx, {client_ip} behind Caddy (dev/nginx-auth-client-ip.template.conf). Every request here
# shares one docker peer, so a spec names its client in X-E2E-Client-IP. Without it the header is
# absent (nginx drops an empty value), GoTrue's per-IP limiters stay off and the sign-up hook sees
# a private address. A token refresh carries no address, as on a real instance.
map "$uri?$args" $e2e_sb_forwarded_for {
    default $http_x_e2e_client_ip;
    "~^/auth/v1/token\?grant_type=refresh_token$" "";
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 50m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/auth/v1/(.*)$ {
        set $upstream_auth auth;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://$upstream_auth:9999/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sb-Forwarded-For $e2e_sb_forwarded_for;
        include /etc/nginx/conf.d/cors.inc;
    }

    location ~ ^/rest/v1/(.*)$ {
        set $upstream_rest rest;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://$upstream_rest:3000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/cors.inc;
    }

    location ~ ^/storage/v1/(.*)$ {
        set $upstream_storage storage;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://$upstream_storage:5000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kong sets it for its stripped /storage/v1; storage-api prefixes tus Locations with it.
        proxy_set_header X-Forwarded-Prefix /storage/v1;
        include /etc/nginx/conf.d/cors.inc;
    }

    location ~ ^/(realtime|functions)/v1/ {
        add_header Content-Type application/json always;
        return 501 '{"message":"not in the e2e stack: realtime and functions are absent"}';
    }
}
