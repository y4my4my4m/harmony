# Path split supabase-js expects: /auth/v1 -> GoTrue, /rest/v1 -> PostgREST.
# Upstream names go through variables so nginx resolves them per request;
# named directly they are resolved once at start and a container that is not
# up yet kills the config load.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    # Uploads are unused here, but a low limit turns into an opaque 413.
    client_max_body_size 50m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/auth/v1/(.*)$ {
        set $upstream_auth auth;
        proxy_pass http://$upstream_auth:9999/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/rest/v1/(.*)$ {
        set $upstream_rest rest;
        proxy_pass http://$upstream_rest:3000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage and realtime are not in this stack. 501 names the gap; without it
    # supabase-js reports a 404 that reads like a missing row.
    location ~ ^/(storage|realtime|functions)/v1/ {
        add_header Content-Type application/json always;
        return 501 '{"message":"not in the e2e stack: storage, realtime and functions are absent"}';
    }
}
