# Path split supabase-js expects: /auth/v1 -> GoTrue, /rest/v1 -> PostgREST.
# Upstreams go through variables to force per-request resolution; a literal
# name is resolved at load and fails the config while its container is down.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    client_max_body_size 50m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/auth/v1/(.*)$ {
        set $upstream_auth auth;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://$upstream_auth:9999/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/cors.inc;
    }

    location ~ ^/rest/v1/(.*)$ {
        set $upstream_rest rest;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://$upstream_rest:3000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/cors.inc;
    }

    location ~ ^/(storage|realtime|functions)/v1/ {
        add_header Content-Type application/json always;
        return 501 '{"message":"not in the e2e stack: storage, realtime and functions are absent"}';
    }
}
