# =============================================================================
# Harmony Full Stack Docker Compose (Self-Hosted Supabase)
# =============================================================================
# Complete self-hosted stack including Supabase
#
# Prerequisites:
#   1. Clone Supabase docker: git clone https://github.com/supabase/supabase
#   2. Configure Supabase .env (copy from supabase/docker/.env.example)
#   3. Build frontend: npm run build-only
#   4. Configure Harmony env files
#
# Usage:
#   # Start Supabase first (in supabase/docker directory):
#   docker compose up -d
#
#   # Then start Harmony:
#   docker compose -f docker-compose.full.yml up -d
#
# Alternatively, if Supabase is already running, this will connect to it
# via the supabase_default network.
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Federation Backend
  # ---------------------------------------------------------------------------
  federation-backend:
    build:
      context: ./federation-backend
      dockerfile: Dockerfile
    container_name: harmony-federation
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./federation-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Override for Docker networking to Supabase
      - SUPABASE_URL=http://supabase-kong:8000
      # pg-boss queue (reliable federation) - enabled since we have direct DB access
      - USE_PGBOSS_QUEUE=true
      - DATABASE_URL=postgresql://supabase_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@supabase-db:5432/postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - harmony
      - supabase_default
    depends_on:
      - redis

  # ---------------------------------------------------------------------------
  # Bot Gateway (Optional)
  # ---------------------------------------------------------------------------
  bot-gateway:
    build:
      context: ./bot-gateway
      dockerfile: Dockerfile
    container_name: harmony-bot-gateway
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./bot-gateway/.env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SUPABASE_URL=http://supabase-kong:8000
    networks:
      - harmony
      - supabase_default
    profiles:
      - bots

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: harmony-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - harmony

  # ---------------------------------------------------------------------------
  # LiveKit (Voice/Video)
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: harmony-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./webrtc/livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    networks:
      - harmony
    profiles:
      - voice

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: harmony-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./dev/nginx-harmony.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - harmony
    depends_on:
      - federation-backend

networks:
  harmony:
    driver: bridge
  supabase_default:
    external: true

volumes:
  redis-data:

