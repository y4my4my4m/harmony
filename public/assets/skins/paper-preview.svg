  <rect x="64" y="118" width="78" height="5" rx="2" fill="#1A1712"/>
  <rect x="163" y="117" width="7" height="7" fill="#EB4E2C" stroke="#1A1712" stroke-width="1.5"/>
  <rect x="64" y="137" width="6" height="6" fill="#EB4E2C" stroke="#1A1712" stroke-width="1.2"/>
  <rect x="75" y="138" width="26" height="4" rx="1" fill="#4A443A"/>
  <rect x="64" y="150" width="62" height="5" rx="2" fill="#4A443A"/>

