  <rect x="306" y="10.5" width="7" height="7" fill="#EB4E2C" stroke="#1A1712" stroke-width="1.5"/>
  <rect x="318" y="11.5" width="82" height="6" rx="1.5" fill="#1A1712"/>

  <!-- Rail: inked discs on offsets; the open server is a blue tile -->
