<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.10 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.14 0"/>
    </filter>
    <pattern id="stripes" width="4" height="3.5" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#1A1712"/>
    </pattern>
    <pattern id="stripes-faint" width="4" height="3.5" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#1A1712" fill-opacity="0.24"/>
    </pattern>
  </defs>

  <!-- Desk -->
  <rect width="600" height="280" fill="#F3EEE3"/>
  <rect width="600" height="280" filter="url(#grain)"/>

  <!-- Context capsule -->
  <rect x="300" y="8" width="112" height="17" rx="8.5" fill="#1A1712"/>
