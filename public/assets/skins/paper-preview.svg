  <rect x="38" y="104" width="8" height="8" fill="#EB4E2C" stroke="#1A1712" stroke-width="1.5"/>

  <!-- Channels on the desk -->
  <rect x="62" y="32" width="96" height="10" rx="2" fill="#1A1712"/>
  <rect x="58" y="48" width="118" height="2" fill="#1A1712"/>
  <rect x="64" y="60" width="6" height="6" fill="#EB4E2C" stroke="#1A1712" stroke-width="1.2"/>
