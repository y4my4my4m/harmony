  <rect x="224" y="203" width="30" height="13" rx="4" fill="#CFE9F6" stroke="#1A1712" stroke-width="1.5"/>
  <circle cx="232" cy="209.5" r="3" fill="#EB4E2C"/>
  <rect x="238" y="208" width="10" height="3.5" rx="1" fill="#1A1712"/>
  <rect x="260" y="203" width="28" height="13" rx="4" fill="#FBF8F1" stroke="#1A1712" stroke-width="1.5"/>
  <circle cx="268" cy="209.5" r="3" fill="#0EA5E9"/>
  <rect x="274" y="208" width="9" height="3.5" rx="1" fill="#1A1712"/>

  <!-- Composer -->
  <rect x="201" y="234" width="292" height="22" rx="7" fill="#1A1712"/>
  <rect x="198" y="231" width="292" height="22" rx="7" fill="#FBF8F1" stroke="#1A1712" stroke-width="2"/>
  <rect x="204" y="236" width="12" height="12" rx="3" fill="#1A1712"/>
  <path d="M210 239 v6 M207 242 h6" stroke="#FBF8F1" stroke-width="1.6"/>
  <rect x="222" y="240" width="74" height="4" rx="1" fill="#635C4F"/>

