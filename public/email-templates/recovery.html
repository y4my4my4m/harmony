<!--
  GoTrue password reset email (GOTRUE_MAILER_TEMPLATES_RECOVERY): Go html/template with GoTrue's
  mail data. The link opens the app's password page with the token hash; the page redeems the
  token (POST /verify) when the new password is submitted. GoTrue's ConfirmationURL is a
  GET of /verify, which spends the token for whoever fetches it first: mail scanners and link
  previews included.
-->
<h2>Reset your password</h2>
<p>Someone asked to reset the password of your account on {{ .SiteURL }}.</p>
<p><a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a></p>
<p>The link works once. If you did not ask for this, ignore this email; your password stays as it is.</p>
