Inspire the space lover in your family with amazing wall art. Our Exoplanet Travel Bureau put together this poster series called &#x201c;Visions of the Future.&#x201d; Nine artists, designers, and illustrators were involved in designing the original 14 posters, which are the result of any brainstorming sessions with &#064;NASAJPL scientists, engineers, and expert communicators. These images are free for you to print, and can be found at jpl.nasa.gov/galleries/visions-of-the-future/ (link in bio).&#x2063;
&#x2063;
Image descriptions: A swipe-through of four illustrated posters.&#x2063;
1. A retro-styled graphic of five spacecraft fly across a conceptual take on Saturn. &#x201c;The Grand Tour&#x201d; is written at the bottom.&#x2063;
2. Bold shapes and colors in reds, purples, and blues contrast in this abstract travel poster for Mars. The text reads, &#x201c;Visit the Historic Sites. Mars, Multiple Tours Available.&quot;&#x2063;
3. Hot air balloons hover above a conceptual take of Jupiter&#x2019;s surface in shades of purple and brown. Auroras in shades of green and purple shine above. The text reads, &#x201c;Experience the mighty auroras of Jupiter.&quot;	&#x2063;
4. In shades of blue, three look through a window, peering into a world under water. A diver swims among the tendrils of a structure in the distance. The text reads, &#x201c;Europa: Discover life under the ice.&quot;&#x2063;
&#x2063;
Credit: NASA/JPL-Caltech&#x2063;

597","media_type":2,"product_type":"clips","user":{"pk":"528817151","username":"nasa","id":"17841401474538262"},"id":"POLARIS_4004634989362489982"}},{"node":{"__typename":"XIGPolarisImageMedia","pk":"4001971394119634476","__isXIGPolarisMedia":"XIGPolarisImageMedia","accessibility_caption":"Photo by NASA Webb Telescope on October 06, 2026. May be an image of text.","caption":{"text":"Brewing up new stars 🪄\n \n@NASAWebb’s unique view of the stellar nursery known as NGC 7129 reveals numerous stars formerly hidden in this cosmic cauldron. \n \nStars begin their life in cold, dense regions of dust and gas, hiding from view of most telescopes. Webb’s high degree of infrared sensitivity allows astronomers to peer through dust to study these baby stars. \n \nIn this image, we can see stars in various stages of development. The most mature and massive (about 5-8x the mass of our Sun) is the region’s bright central star. In the cavity on the left, appearing in gold, is the largest demonstration of its impact. The outflows from an earlier stage in the star’s development carve into the dense molecular cloud of hydrogen, and combine with the star’s light, causing it to glow. \n \nThe region on the right, represented in red, hides much younger objects than those on the left: protostars. As the protostars accumulate matter and increase mass, they eject outflows of super heated material that interact with matter around the star, creating shocks that cause the textured appearance we see in this image. More protostar outflows are at upper left where a dark shadow is being cast by a protostar disk, visible against the surrounding nebula, depicted in blue. \n \nSeeing these different structures help astronomers study the star lifecycle in various stages, leading to a more complete understanding of our universe. \n\nSee more in the link in @NASAWebb’s bio.\n \nImage credit: NASA, ESA, CSA, STScI, Processing: Alyssa Pagan.\n \nImage description in comments."},"code":"DeJ28eTxo4s","seo_c \nFree artwork provided. All you need to do is download, print and frame.⁣\n⁣\nInspire the space lover in your family with amazing wall art. Our Exoplanet Travel Bureau put together this poster series called “Visions of the Future.” Nine artists, designers, and illustrators were involved in designing the original 14 posters, which are the result of any brainstorming sessions with @NASAJPL scientists, engineers, and expert communicators. These images are free for you to print, and can be found at jpl.nasa.gov/galleries/visions-of-the-future/ (link in bio).⁣\n⁣\nImage descriptions: A swipe-through of four illustrated posters.⁣\n1. A retro-styled graphic of five spacecraft fly across a conceptual take on Saturn. “The Grand Tour” is written at the bottom.⁣\n2. Bold shapes and colors in reds, purples, and blues contrast in this abstract travel poster for Mars. The text reads, “Visit the Historic Sites. Mars, Multiple Tours Available.\"⁣\n3. Hot air balloons hover above a conceptual take of Jupiter’s surface in shades of purple and brown. Auroras in shades of green and purple shine above. The text reads, “Experience the mighty auroras of Jupiter.\"\t⁣\n4. In shades of blue, three look through a window, peering into a world under water. A diver swims among the tendrils of a structure in the distance. The text reads, “Europa: Discover life under the ice.\"⁣\n⁣\nCredit: NASA/JPL-Caltech⁣\n⁣\n#NASA #Holidays #Travel #Poster #Space #SpaceLovers #Spacecraft #GiftGuide #Gift #Presents #Free","created_at":1701816033},"caption_is_edited":false,"carousel_media":[{"__typename":"XIGPolarisImageMedia","accessibility_caption":"Photo by NASA on December 05, 2023.","code":"C0fQuDHpFlH","display_uri":"https://scontent-nrt1-1.cdninstagram.com/v/t51.82787-15/656063940_18084752405201551_8203641236571778540_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=109&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=VbshVunrTj0Q7kNvwEeeZ1r&_nc_oc=Adqz-DXNS8
