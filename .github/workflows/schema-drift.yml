name: Schema drift

# A fresh install runs init/init.sql then every migration, so applying the
# migrations to a fresh init must leave the schema unchanged. Anything else
# means a new instance and a migrated one end up different.

on:
  pull_request:
    paths:
      - 'db_schema/**'
      - 'scripts/test-db/**'
      - 'scripts/schema-drift-check.sh'
      - '.github/workflows/schema-drift.yml'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check init/ against init/ + migrations/
        run: ./scripts/schema-drift-check.sh

      - name: Keep the dumps for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-dumps
          path: /tmp/harmony-drift/
          retention-days: 7

  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Adding or removing a client-reachable endpoint must be a visible diff.
      # Supabase grants EXECUTE on every public function to anon by default, so
      # a new function is callable without authentication the moment it exists.
      - name: Regenerate the RPC surface manifest
        run: ./scripts/generate-surface.sh

      - name: Fail if the manifest is stale
        run: |
          if ! git diff --exit-code db_schema/SURFACE.tsv; then
            echo "::error::db_schema/SURFACE.tsv is out of date."
            echo "::error::Run scripts/generate-surface.sh and commit the result."
            exit 1
          fi

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # RLS and topic authorization are not expressible in Vitest: they depend
      # on the querying role and the JWT claim, so they can only be asserted
      # inside the database.
      - name: Run the pgTAP suite
        run: ./scripts/run-db-tests.sh
