name: Matrix bridge

on:
  push:
    branches: [master]
    paths: ['matrix-bridge/**', '.github/workflows/matrix-bridge.yml']
  pull_request:
    branches: [master]
    paths: ['matrix-bridge/**', '.github/workflows/matrix-bridge.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: matrix-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: matrix-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Real Synapse smoke test (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:synapse
