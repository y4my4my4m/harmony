name: Images

# Container images on GHCR, linux/amd64 + linux/arm64, under the repository
# owner's namespace (ghcr.io/<owner, lower-cased>):
#   ghcr.io/y4my4my4m/harmony-web           self-host/web.Dockerfile (repo root context)
#   ghcr.io/y4my4my4m/harmony-federation    federation-backend/
#   ghcr.io/y4my4my4m/harmony-bot-gateway   bot-gateway/
#
# Tag vX.Y.Z   -> X.Y.Z, X.Y, latest (a pre-release vX.Y.Z-rc.N gets X.Y.Z-rc.N only)
# Push master  -> edge, sha-<short>
# Pull request -> built for both platforms, never pushed
# Dispatch     -> pushed as above when run on master or a v* tag, else built only
#
# Forks build without pushing unless they opt in with the repository variable
# PUBLISH_IMAGES=true (Settings, Secrets and variables, Actions, Variables);
# they then publish into their own namespace, e.g. ghcr.io/<fork owner>/harmony-web,
# which self-host selects with HARMONY_REGISTRY. New GHCR packages start private.
#
# harmony-web carries no instance values: its entrypoint writes /config.json
# from the container environment.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream publishes; a fork only with PUBLISH_IMAGES=true, and only into its own namespace.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.repository_owner == 'y4my4my4m' || vars.PUBLISH_IMAGES == 'true') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
  # OCI annotations on the multi-platform index too: GHCR reads the package
  # description from there.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harmony-web
            context: .
            file: self-host/web.Dockerfile
            description: Harmony web client, served by nginx. Instance values come from the container environment at start.
          - image: harmony-federation
            context: federation-backend
            file: federation-backend/Dockerfile
            description: Harmony federation backend. FEDERATION_MODE selects server, worker or unified.
          - image: harmony-bot-gateway
            context: bot-gateway
            file: bot-gateway/Dockerfile
            description: Harmony bot gateway (REST and WebSocket).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The web footer names the release, as deploy-master.sh stamps prod: the tag on a tag
      # push, else the latest v* tag reachable from the commit; without one, package.json's
      # version stays.
      - name: Stamp version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')"
          fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/set-version.mjs "$ver"
          else
            echo "::notice::no release version for ${GITHUB_REF} ('${ver}'); package.json's is kept"
          fi

      # GHCR names must be lower case; GitHub owner names need not be.
      - name: Registry
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      # Base images follow .nvmrc exactly; the Dockerfiles default to the major.
      - name: Node version
        id: node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.registry.outputs.name }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=master
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
