name: Images

# Container images on GHCR, linux/amd64 + linux/arm64:
#   ghcr.io/y4my4my4m/harmony-web           self-host/web.Dockerfile (repo root context)
#   ghcr.io/y4my4my4m/harmony-federation    federation-backend/
#   ghcr.io/y4my4my4m/harmony-bot-gateway   bot-gateway/
#
# Tag vX.Y.Z   -> X.Y.Z, X.Y, latest (a pre-release vX.Y.Z-rc.N gets X.Y.Z-rc.N only)
# Push master  -> edge, sha-<short>
# Pull request -> built for both platforms, never pushed
# Dispatch     -> pushed as above when run on master or a v* tag, else built only
#
# harmony-web carries no instance values: its entrypoint writes /config.json
# from the container environment.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/y4my4my4m
  # Forks build but do not push into this namespace.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.repository_owner == 'y4my4my4m' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
  # OCI annotations on the multi-platform index too: GHCR reads the package
  # description from there.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harmony-web
            context: .
            file: self-host/web.Dockerfile
            description: Harmony web client, served by nginx. Instance values come from the container environment at start.
          - image: harmony-federation
            context: federation-backend
            file: federation-backend/Dockerfile
            description: Harmony federation backend. FEDERATION_MODE selects server, worker or unified.
          - image: harmony-bot-gateway
            context: bot-gateway
            file: bot-gateway/Dockerfile
            description: Harmony bot gateway (REST and WebSocket).
    steps:
      - uses: actions/checkout@v4

      # Base images follow .nvmrc exactly; the Dockerfiles default to the major.
      - name: Node version
        id: node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=master
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
