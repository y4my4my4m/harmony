name: Stream audio capture

# harmony-stream-audio's probe on real macOS and Windows runners with a virtual sound card. Each
# case plays a 440 Hz tone from the source under test and, for app and window scope, a 1 kHz
# distractor from an unrelated process; the probe must hear the tone at its pitch. Window cases
# go through the label the app gets from getDisplayMedia (WebKit: the title; WebView2: the HWND).
# Every case runs; the job fails when any did.
on:
  pull_request:
    paths:
      - src-tauri/crates/harmony-stream-audio/**
      - .github/workflows/stream-audio.yml
  push:
    branches: [feat/stream-audio]
    paths:
      - src-tauri/crates/harmony-stream-audio/**
      - .github/workflows/stream-audio.yml
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI_DIR: src-tauri/crates/harmony-stream-audio/ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1
      - name: Build probe
        working-directory: src-tauri
        run: cargo build -p harmony-stream-audio --example probe

      - name: Sources (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          system_profiler SPAudioDataType | grep -E '^ {8}[^ ]|Default Output' || true
          ls /Applications
          for hz in 440 1000; do
            python3 "$CI_DIR/tone.py" $hz 1 "$RUNNER_TEMP/tone-$hz.wav"
            python3 "$CI_DIR/tone.py" $hz 40 "$RUNNER_TEMP/tone-$hz-long.wav"
          done
          cp "$CI_DIR/tone.html" "$RUNNER_TEMP/"
          app="$RUNNER_TEMP/ToneWindow.app"
          mkdir -p "$app/Contents/MacOS"
          swiftc -O "$CI_DIR/ToneWindow.swift" -o "$app/Contents/MacOS/ToneWindow"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>online.knowmad.harmony.probe.tonewindow</string>
            <key>CFBundleName</key><string>ToneWindow</string>
            <key>CFBundleExecutable</key><string>ToneWindow</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          PLIST
          codesign --force -s - "$app"

      # ToneWindow is launched through LaunchServices, so it is its own responsible process, as
      # an app the user opens is. afplay and the probe share the runner's responsibility.
      - name: System scope (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: src-tauri
        run: |
          open -n "$RUNNER_TEMP/ToneWindow.app" --args native "Harmony probe system" "$RUNNER_TEMP/tone-440.wav"
          sleep 4
          code=0; target/debug/examples/probe --expect-hz 440 system || code=$?
          pkill -x ToneWindow || true
          echo "probe exit $code"; exit $code

      - name: System scope, afplay (macOS, diagnostic)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        working-directory: src-tauri
        run: |
          afplay "$RUNNER_TEMP/tone-440-long.wav" & player=$!
          ( for _ in $(seq 1 10); do afplay /System/Library/Sounds/Submarine.aiff || true; done ) & loop=$!
          sleep 1
          code=0; target/debug/examples/probe system || code=$?
          kill $player $loop 2>/dev/null || true; pkill -x afplay || true
          echo "probe exit $code"; exit $code

      - name: App scope by pid (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: src-tauri
        run: |
          open -n "$RUNNER_TEMP/ToneWindow.app" --args native "Harmony probe app" "$RUNNER_TEMP/tone-440.wav"
          afplay "$RUNNER_TEMP/tone-1000-long.wav" & distractor=$!
          sleep 4
          pid=$(pgrep -n -x ToneWindow)
          code=0; target/debug/examples/probe --expect-hz 440 app "$pid" || code=$?
          pkill -x ToneWindow || true; kill $distractor 2>/dev/null || true
          echo "probe exit $code"; exit $code

      # A process without a window-server connection is no SCRunningApplication, so an
      # including content filter cannot name it.
      - name: App scope, afplay by pid (macOS, diagnostic)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        working-directory: src-tauri
        run: |
          afplay "$RUNNER_TEMP/tone-440-long.wav" & player=$!
          sleep 1
          target/debug/examples/probe list afplay
          code=0; target/debug/examples/probe --seconds 3 app $player || code=$?
          kill $player 2>/dev/null || true
          echo "probe exit $code"; exit $code

      - name: Window scope, native player (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: src-tauri
        run: |
          open -n "$RUNNER_TEMP/ToneWindow.app" --args native "Harmony probe window" "$RUNNER_TEMP/tone-440.wav"
          afplay "$RUNNER_TEMP/tone-1000-long.wav" & distractor=$!
          sleep 4
          code=0; target/debug/examples/probe --expect-hz 440 window "Harmony probe window" || code=$?
          pkill -x ToneWindow || true; kill $distractor 2>/dev/null || true
          echo "probe exit $code"; exit $code

      # WebKit renders the page's audio in its GPU process, an XPC service of the host app.
      - name: Window scope, WKWebView page (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: src-tauri
        run: |
          open -n "$RUNNER_TEMP/ToneWindow.app" --args webkit "Harmony probe webkit" "$RUNNER_TEMP/tone.html"
          afplay "$RUNNER_TEMP/tone-1000-long.wav" & distractor=$!
          sleep 6
          target/debug/examples/probe list WebKit
          code=0; target/debug/examples/probe --expect-hz 440 window "Harmony probe webkit" || code=$?
          pkill -x ToneWindow || true; kill $distractor 2>/dev/null || true
          echo "probe exit $code"; exit $code

      # The tester's case: a browser window whose page plays audio. Chrome renders it in its
      # audio service, a helper process. `open` runs in the background: it can wait on a
      # first-launch check.
      - name: Window scope, Google Chrome (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 5
        working-directory: src-tauri
        run: |
          chrome="/Applications/Google Chrome.app"
          test -d "$chrome" || { echo "::error::Google Chrome is not installed"; exit 1; }
          xattr "$chrome" || true
          sudo xattr -dr com.apple.quarantine "$chrome" || true
          open -na "Google Chrome" --args --user-data-dir="$RUNNER_TEMP/chrome" --no-first-run \
            --no-default-browser-check --use-mock-keychain --autoplay-policy=no-user-gesture-required \
            --new-window "file://$RUNNER_TEMP/tone.html" > "$RUNNER_TEMP/open.log" 2>&1 &
          found=0
          for i in $(seq 1 60); do
            if target/debug/examples/probe list 2>/dev/null | grep -q 'Harmony probe tone'; then found=1; echo "window after ~$((i * 2)) s"; break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/open.log" || true
          if [ $found = 0 ]; then
            ps -axo pid,ppid,etime,comm | grep -iE 'chrome|/open$|CoreServicesUIAgent|syspolicyd' | grep -v grep || true
            echo "::error::no Chrome window titled Harmony probe tone"; exit 1
          fi
          afplay "$RUNNER_TEMP/tone-1000-long.wav" & distractor=$!
          sleep 3
          target/debug/examples/probe list Chrome
          code=0; target/debug/examples/probe --expect-hz 440 window "Harmony probe tone" || code=$?
          pkill -x "Google Chrome" || true; kill $distractor 2>/dev/null || true
          echo "probe exit $code"; exit $code

      - name: Screen at failure (macOS)
        if: ${{ failure() && runner.os == 'macOS' }}
        run: screencapture -x "$RUNNER_TEMP/screen.png" || true
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && runner.os == 'macOS' }}
        with:
          name: probe-screen-macos
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: ignore

      - name: Sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          foreach ($hz in 440, 1000) { python "$env:CI_DIR/tone.py" $hz 1 "$env:RUNNER_TEMP/tone-$hz.wav" }
          Copy-Item "$env:CI_DIR/tone.html" $env:RUNNER_TEMP
          Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe' -ErrorAction SilentlyContinue | Format-List FullName, VersionInfo

      - name: System scope (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: src-tauri
        shell: pwsh
        run: |
          $wav = Join-Path $env:RUNNER_TEMP 'tone-440.wav'
          $play = "`$p = New-Object Media.SoundPlayer '$wav'; `$p.PlayLooping(); Start-Sleep 30"
          $player = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', $play
          Start-Sleep 2
          target\debug\examples\probe.exe system
          $code = $LASTEXITCODE
          Write-Host ("probe exit {0} (0x{0:X8})" -f $code)
          Stop-Process -Id $player.Id -ErrorAction SilentlyContinue
          exit $code

      - name: Window scope, native player (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: src-tauri
        shell: pwsh
        run: |
          $wav = Join-Path $env:RUNNER_TEMP 'tone-440.wav'
          $other = Join-Path $env:RUNNER_TEMP 'tone-1000.wav'
          $form = "Add-Type -AssemblyName System.Windows.Forms; `$p = New-Object Media.SoundPlayer '$wav'; `$p.PlayLooping(); " +
            "`$f = New-Object Windows.Forms.Form; `$f.Text = 'Harmony probe window'; [Windows.Forms.Application]::Run(`$f)"
          $player = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $form
          $play = "`$p = New-Object Media.SoundPlayer '$other'; `$p.PlayLooping(); Start-Sleep 30"
          $distractor = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', $play
          Start-Sleep 4
          target\debug\examples\probe.exe list
          target\debug\examples\probe.exe --expect-hz 440 window 'Harmony probe window'
          $code = $LASTEXITCODE
          Write-Host ("probe exit {0} (0x{0:X8})" -f $code)
          Stop-Process -Id $player.Id, $distractor.Id -ErrorAction SilentlyContinue
          exit $code

      - name: Window scope, Google Chrome (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: src-tauri
        shell: pwsh
        run: |
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { Write-Host "::error::Google Chrome is not installed"; exit 1 }
          $page = 'file:///' + ((Join-Path $env:RUNNER_TEMP 'tone.html') -replace '\\', '/')
          $userData = Join-Path $env:RUNNER_TEMP 'chrome'
          $browser = Start-Process $chrome -PassThru -ArgumentList "--user-data-dir=$userData", '--no-first-run',
            '--no-default-browser-check', '--autoplay-policy=no-user-gesture-required', '--new-window', $page
          $other = Join-Path $env:RUNNER_TEMP 'tone-1000.wav'
          $play = "`$p = New-Object Media.SoundPlayer '$other'; `$p.PlayLooping(); Start-Sleep 30"
          $distractor = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', $play
          Start-Sleep 10
          Get-CimInstance Win32_Process -Filter "Name = 'chrome.exe'" |
            Select-Object ProcessId, ParentProcessId, @{ n = 'Type'; e = { if ($_.CommandLine -match '--type=(\S+)') { $Matches[1] } else { 'browser' } } },
              @{ n = 'Sub'; e = { if ($_.CommandLine -match '--utility-sub-type=(\S+)') { $Matches[1] } else { '' } } } |
            Format-Table -AutoSize
          target\debug\examples\probe.exe --expect-hz 440 window 'Harmony probe tone'
          $code = $LASTEXITCODE
          Write-Host ("probe exit {0} (0x{0:X8})" -f $code)
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          Stop-Process -Id $distractor.Id -ErrorAction SilentlyContinue
          exit $code
