name: Tauri

# Public repo = unlimited free Actions minutes, but keep native builds off every
# feature-branch commit: pre-merge check on PRs to master, post-merge on master,
# and manual dispatch on demand. Skipped when only docs/backend change.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'federation-backend/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'federation-backend/**']
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  # Frontend needs Supabase vars at build; the native client picks the real
  # instance at runtime, so build-time placeholders are fine.
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL != '' && secrets.TEST_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY != '' && secrets.TEST_SUPABASE_ANON_KEY || 'placeholder-key' }}

jobs:
  # Windows/macOS use webview WebRTC (WebView2 / WKWebView). native-media
  # (LiveKit/wgpu) is Linux-target-gated, so it is never pulled here.
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # NSIS only. The WiX .msi is a second installer for the same payload and
      # is not published, so building it wastes several minutes per run.
      - name: Build Windows installer
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Universal .dmg/.app. Unsigned: users must right-click > Open on first
      # launch (Gatekeeper). Notarization needs an Apple Developer cert (secrets).
      - name: Build macOS app
        run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Mirrors release.yml so the signing path is exercised before a release is
      # cut, not for the first time during one.
      # Secrets are passed via env, not inline ${{ }}, so quoting in a password
      # cannot break the shell. Whitespace is stripped before decoding: base64
      # -d rejects the whole input on a stray CR or wrapped line.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 release.keystore"
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --target aarch64

      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a debug-signed APK. Add signing secrets for proper release builds."
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
