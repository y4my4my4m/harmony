name: Tauri

# Test builds on manual dispatch: the chosen branch, platforms and profile.
# Release builds come from release.yml on tags, which restores the caches these
# jobs save on master. A tag run reads only default-branch caches, and GitHub
# evicts a cache unused for 7 days, so master also builds every platform weekly
# and when a dependency lockfile or the Android Gradle setup changes.
on:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [master]
    paths:
      - src-tauri/Cargo.lock
      - package-lock.json
      - src-tauri/gen/android/**/*.gradle.kts
      - src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - src-tauri/linux/package.sh
      - .github/workflows/tauri.yml
  workflow_dispatch:
    inputs:
      windows:
        description: Windows installer
        type: boolean
        default: true
      macos:
        description: macOS dmg
        type: boolean
        default: true
      android:
        description: Android APK
        type: boolean
        default: true
      linux:
        description: Linux AppImage and deb
        type: boolean
        default: true
      ios:
        description: iOS IPA, unsigned (sideload)
        type: boolean
        default: false
      profile:
        description: Build profile. An Android release build without the signing secrets falls back to debug.
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PROFILE: ${{ inputs.profile || 'release' }}
  # Frontend needs Supabase vars at build; the native client picks the real
  # instance at runtime, so build-time placeholders are fine.
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL != '' && secrets.TEST_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY != '' && secrets.TEST_SUPABASE_ANON_KEY || 'placeholder-key' }}
  # Instance picker prefill (repository variable); unset leaves the field empty.
  VITE_DEFAULT_INSTANCE_URL: ${{ vars.DEFAULT_INSTANCE_URL }}
  # Push relay for this build's FCM on instances without its Firebase project
  # (repository variable, an https origin); unset: no relay.
  VITE_PUSH_RELAY_ORIGIN: ${{ vars.PUSH_RELAY_ORIGIN }}

jobs:
  # Windows/macOS use the system webview (WebView2 / WKWebView); the CEF
  # runtime is a Linux-only dependency, so it is never pulled here.
  windows:
    name: Windows build
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # NSIS only. The WiX .msi is a second installer for the same payload and
      # is not published, so building it wastes several minutes per run.
      - name: Build Windows installer
        run: npx tauri build ${{ env.BUILD_PROFILE == 'debug' && '--debug' || '' }} --target x86_64-pc-windows-msvc --bundles nsis
      - name: Name installer
        id: artifact
        shell: bash
        run: bash scripts/name-artifact.sh Windows "$BUILD_PROFILE" src-tauri/target/x86_64-pc-windows-msvc/"$BUILD_PROFILE"/bundle/nsis/*.exe
      # archive: false uploads the file itself; the artifact takes its name.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  macos:
    name: macOS build
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Universal .dmg/.app. Unsigned: users must right-click > Open on first
      # launch (Gatekeeper). Notarization needs an Apple Developer cert (secrets).
      - name: Build macOS app
        run: npx tauri build ${{ env.BUILD_PROFILE == 'debug' && '--debug' || '' }} --target universal-apple-darwin
      - name: Name dmg
        id: artifact
        run: bash scripts/name-artifact.sh macOS "$BUILD_PROFILE" src-tauri/target/universal-apple-darwin/"$BUILD_PROFILE"/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  # Dispatch only: no release consumes its caches. Unsigned, as no Apple
  # Developer Program membership exists; users re-sign the IPA with their own
  # Apple ID when sideloading (docs/use/ios.md).
  #
  # Signing secrets, unset. With a membership: APPLE_DEVELOPMENT_TEAM,
  # IOS_CERTIFICATE (base64 .p12), IOS_CERTIFICATE_PASSWORD and
  # IOS_MOBILE_PROVISION (base64 profile) as env of the build step, which then
  # drops --no-sign and --archive-only and passes --export-method
  # (release-testing for TestFlight, app-store-connect for the App Store).
  # Uploads authenticate with APPLE_API_KEY, APPLE_API_ISSUER and
  # APPLE_API_KEY_PATH (App Store Connect API key file).
  ios:
    name: iOS IPA (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # src-tauri/gen/apple carries project.yml, not the Xcode project generated
      # from it. xcodegen rejects a missing source path; both directories are
      # gitignored.
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          mkdir -p src-tauri/gen/apple/assets src-tauri/gen/apple/Externals
          xcodegen generate --spec src-tauri/gen/apple/project.yml
      # --no-sign archives with CODE_SIGNING_ALLOWED=NO; --archive-only stops
      # before the export, which needs a signing identity.
      - name: Build unsigned archive
        run: npx tauri ios build --no-sign --archive-only --target aarch64 ${{ env.BUILD_PROFILE == 'debug' && '--debug' || '' }}
      - name: Package IPA
        id: artifact
        run: |
          app=src-tauri/gen/apple/build/app_iOS.xcarchive/Products/Applications/Harmony.app
          lipo -info "$app/Harmony"
          family=$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist" | tr -d '[:space:]')
          [ "$family" = '[1,2]' ] || { echo "::error::UIDeviceFamily is $family, expected [1,2]"; exit 1; }
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription \
            NSPhotoLibraryAddUsageDescription NSLocalNetworkUsageDescription UILaunchStoryboardName; do
            plutil -extract "$key" raw -o - "$app/Info.plist" >/dev/null || { echo "::error::Info.plist lacks $key"; exit 1; }
          done
          stem=$(bash scripts/name-artifact.sh iOS "$BUILD_PROFILE")
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          (cd "$out" && zip -qry "$stem.ipa" Payload)
          echo "path=$out/$stem.ipa" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  android:
    name: Android APK
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # A release APK needs the signing keystore; without it the build is debug.
      APK_PROFILE: ${{ (inputs.profile || 'release') == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The action's default package list includes `tools`, which cmdline-tools
      # 16.0 no longer carries; sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Gradle distribution, dependencies and build cache for release.yml. Each
      # master run saves a new entry (run id suffix) so the build cache stays
      # current; restores take the newest. The key is hashed here, before the
      # build generates Gradle files of its own.
      - name: Enable the Gradle build cache
        run: mkdir -p ~/.gradle && echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/**/*.gradle', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            gradle-android-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/**/*.gradle', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/Cargo.lock') }}-
            gradle-android-
      - run: npm ci
      # Mirrors release.yml so the signing path is exercised before a release is
      # cut, not for the first time during one.
      # Secrets are passed via env, not inline ${{ }}, so quoting in a password
      # cannot break the shell. Whitespace is stripped before decoding: base64
      # -d rejects the whole input on a stray CR or wrapped line.
      - name: Configure release signing
        if: env.APK_PROFILE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 release.keystore"
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: env.APK_PROFILE == 'release'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64

      - name: Build debug APK
        if: env.APK_PROFILE == 'debug'
        run: |
          if [ "$BUILD_PROFILE" = release ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a debug-signed APK. Add signing secrets for proper release builds."
          fi
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --debug --target aarch64

      # Robolectric: notification display and cancellation, and UnifiedPush through the
      # connector with a mock distributor. The build above generated the Gradle settings
      # that include the plugin module.
      - name: Android push plugin tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-harmony-push:testDebugUnitTest --console=plain

      # The daemon holds cache files open; stopping it lets the save read a
      # consistent ~/.gradle.
      - name: Stop Gradle
        if: github.ref == 'refs/heads/master'
        working-directory: src-tauri/gen/android
        run: ./gradlew --stop
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Name APK
        id: artifact
        run: bash scripts/name-artifact.sh Android "$APK_PROFILE" src-tauri/gen/android/app/build/outputs/apk/universal/"$APK_PROFILE"/*.apk

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  # Mirrors the release Linux leg without updater signing, then starts the
  # AppImage under Xvfb (src-tauri/linux/smoke-test.sh). Tag runs restore caches
  # saved on the default branch, so the master runs keep the CEF and AppImage
  # tool caches warm for release.yml.
  linux:
    name: Linux build
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # Same list as release.yml's linux job.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build file patchelf strace \
            libgtk-4-dev libssl-dev libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev libdbus-1-dev \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxkbcommon0 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libpulse0 libpipewire-0.3-0t64 libpipewire-0.3-modules libspa-0.2-modules \
            libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            xvfb xauth dbus
      - name: Locate CEF and AppImage tool caches
        run: |
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"
          echo "CEF_TOOLS_DIR=$RUNNER_TEMP/linux-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-152.3.0+152.0.6-linux-x86_64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-tools
          key: linux-tools-${{ hashFiles('src-tauri/linux/package.sh') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build deb
        run: npx tauri build ${{ env.BUILD_PROFILE == 'debug' && '--debug' || '' }} --bundles deb
      # The build links against the extracted tree; the archive only inflates the
      # cache.
      - name: Drop the CEF archive
        run: rm -f "$CEF_PATH"/*/cef_binary_*.tar.bz2
      - name: Build AppImage
        run: sh src-tauri/linux/package.sh src-tauri/target/"$BUILD_PROFILE"/bundle/deb/Harmony_*_amd64.deb
      # A clean ubuntu:24.04 installs the deb with only its declared Depends;
      # every library the payload links must then resolve.
      - name: Check deb dependencies
        run: |
          docker run --rm -v "$PWD/src-tauri/target/$BUILD_PROFILE/bundle/deb:/deb:ro" ubuntu:24.04 sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends /deb/Harmony_*_amd64.deb >/dev/null
            missing=$(ldd /usr/share/Harmony/harmony /usr/share/Harmony/*.so | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }'
      # The runner restricts unprivileged user namespaces through AppArmor, as
      # Ubuntu 23.10+ desktops do, so the AppImage runs Chromium unsandboxed; the
      # installed deb keeps the sandbox through its setuid chrome-sandbox.
      - name: Smoke test
        run: |
          sh src-tauri/linux/smoke-test.sh src-tauri/target/"$BUILD_PROFILE"/bundle/appimage/Harmony_*_amd64.AppImage
          sudo apt-get install -y --no-install-recommends ./src-tauri/target/"$BUILD_PROFILE"/bundle/deb/Harmony_*_amd64.deb
          SMOKE_SANDBOX=on sh src-tauri/linux/smoke-test.sh /usr/bin/harmony
      - name: Name AppImage
        id: appimage
        run: bash scripts/name-artifact.sh Linux "$BUILD_PROFILE" src-tauri/target/"$BUILD_PROFILE"/bundle/appimage/Harmony_*_amd64.AppImage
      - name: Name deb
        id: deb
        run: bash scripts/name-artifact.sh Linux "$BUILD_PROFILE" src-tauri/target/"$BUILD_PROFILE"/bundle/deb/Harmony_*_amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.appimage.outputs.path }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.deb.outputs.path }}
          archive: false
          if-no-files-found: error
