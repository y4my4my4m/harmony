name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run test
        env:
          CI: true

  federation-tests:
    name: Federation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: federation-backend/package-lock.json

      - run: npm ci
        working-directory: federation-backend

      - run: npx vitest run
        working-directory: federation-backend
        env:
          CI: true

  bot-gateway-tests:
    name: Bot Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: bot-gateway/package-lock.json

      - run: npm ci
        working-directory: bot-gateway

      - run: npx vitest run
        working-directory: bot-gateway
        env:
          CI: true

  # ----------------------------------------------------------------
  # Bot gateway against a database built from db_schema/init/.
  # plpgsql resolves column references at first execution, so an RPC naming a
  # column its table lacks installs cleanly and raises only when called.
  # ----------------------------------------------------------------
  bot-gateway-db-tests:
    name: Bot Gateway DB Tests
    runs-on: ubuntu-latest
    env:
      BOT_GATEWAY_DB_CONTAINER: ci-botgw-rpc-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: bot-gateway/package-lock.json

      - run: npm ci
        working-directory: bot-gateway

      - run: npm run test:db
        working-directory: bot-gateway
        env:
          CI: true

      - name: Remove the test database container
        if: always()
        run: docker rm -f "$BOT_GATEWAY_DB_CONTAINER" || true

  # ----------------------------------------------------------------
  # One job per package: vue-tsc reads tsconfig.app.json and tsconfig.node.json
  # and sees neither backend.
  # ----------------------------------------------------------------
  type-check:
    name: Type Check (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npx vue-tsc --build --force

  federation-type-check:
    name: Type Check (federation-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: federation-backend/package-lock.json

      - run: npm ci
        working-directory: federation-backend

      - run: npm run type-check
        working-directory: federation-backend

  bot-gateway-type-check:
    name: Type Check (bot-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: bot-gateway/package-lock.json

      - run: npm ci
        working-directory: bot-gateway

      - run: npm run type-check
        working-directory: bot-gateway

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key

  # ----------------------------------------------------------------
  # Postgres, GoTrue and PostgREST raised from db_schema/init/, seeded, then
  # driven through supabase-js. e2e/stack.sh generates every credential at
  # bring-up; no repository secret is read. Storage, realtime, imgproxy, the
  # federation backend and the browser are outside the stack.
  # ----------------------------------------------------------------
  e2e-stack:
    name: E2E Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run e2e:verify

      - name: Tear the stack down
        if: always()
        run: npm run e2e:down

  # ----------------------------------------------------------------
  # Browser journeys against the same stack as e2e-stack, driving the built app.
  # Separate job: it needs a browser and a dev server, and a Playwright install
  # failure must not read as a schema failure.
  # ----------------------------------------------------------------
  e2e-journeys:
    name: E2E Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # No `playwright install`: the runner image ships Google Chrome stable and
      # playwright.config.ts defaults to channel 'chrome'. Fetching the bundled
      # browser hangs on the runner past the job timeout.
      - run: google-chrome --version

      # stack.sh writes e2e/stack.env; playwright.config.ts loads it before
      # .env.test.
      - run: npm run e2e:up
      - run: npm run e2e:seed

      - run: npx playwright test --project=journeys
        env:
          CI: true

      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: npm run e2e:down

  # ----------------------------------------------------------------
  # ActivityPub round trip: federation-backend's createApp() against a peer
  # inbox bound to the compose bridge gateway, over a database built from
  # db_schema/init/. e2e/federation/stack.sh generates every credential at
  # bring-up; no repository secret is read.
  #
  # Two installs: roundtrip.ts resolves @supabase/supabase-js from the root
  # node_modules, and stack.sh runs it with federation-backend's tsx.
  # ----------------------------------------------------------------
  federation-roundtrip:
    name: Federation Round Trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            federation-backend/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: federation-backend

      - run: bash e2e/federation/stack.sh verify

      - name: Tear the stack down
        if: always()
        run: bash e2e/federation/stack.sh down

  # ----------------------------------------------------------------
  # Single required check for branch protection.
  #
  # `needs` alone does not gate: a skipped or cancelled dependency leaves this
  # job skipped, and a skipped required check reads as success.
  #
  # A job absent from `needs` or from the checks below is a job branch
  # protection never sees.
  # ----------------------------------------------------------------
  ci-verdict:
    name: CI verdict
    runs-on: ubuntu-latest
    if: always()
    needs:
      - unit-tests
      - federation-tests
      - bot-gateway-tests
      - bot-gateway-db-tests
      - type-check
      - federation-type-check
      - bot-gateway-type-check
      - build
      - e2e-stack
      - e2e-journeys
      - federation-roundtrip
    steps:
      - name: Require every job to have succeeded
        run: |
          fail=0

          # Only success passes. No job here is conditional, so `skipped` means
          # one of that job's own dependencies failed.
          check() {
            case "$2" in
              success) printf '  ok        %s\n' "$1" ;;
              *)       printf '  FAILED    %s (%s)\n' "$1" "$2"; fail=1 ;;
            esac
          }

          check "unit-tests"             "${{ needs.unit-tests.result }}"
          check "federation-tests"       "${{ needs.federation-tests.result }}"
          check "bot-gateway-tests"      "${{ needs.bot-gateway-tests.result }}"
          check "bot-gateway-db-tests"   "${{ needs.bot-gateway-db-tests.result }}"
          check "type-check"             "${{ needs.type-check.result }}"
          check "federation-type-check"  "${{ needs.federation-type-check.result }}"
          check "bot-gateway-type-check" "${{ needs.bot-gateway-type-check.result }}"
          check "build"                  "${{ needs.build.result }}"
          check "e2e-stack"              "${{ needs.e2e-stack.result }}"
          check "e2e-journeys"           "${{ needs.e2e-journeys.result }}"
          check "federation-roundtrip"   "${{ needs.federation-roundtrip.result }}"

          [ "$fail" -eq 0 ] || { echo "::error::one or more CI jobs failed"; exit 1; }
          echo "all CI jobs green"
