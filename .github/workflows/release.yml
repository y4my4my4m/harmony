name: Release

# Publishes downloadable installers to a GitHub Release.
# Trigger: push a version tag (e.g. `git tag v1.4.0 && git push --tags`),
# or run manually and pass an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.4.0)"
        required: true

# One run per tag: a dispatch for a tag whose push run is still going waits.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL != '' && secrets.TEST_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY != '' && secrets.TEST_SUPABASE_ANON_KEY || 'placeholder-key' }}
  # Instance picker prefill (repository variable); unset leaves the field empty.
  VITE_DEFAULT_INSTANCE_URL: ${{ vars.DEFAULT_INSTANCE_URL }}

# Jobs build the tag's tree and run helper scripts from .ci, a checkout of the
# workflow's own commit: a dispatch can rebuild a tag that predates them, and
# names cannot drift from tauri.yml, which runs the same scripts.
#
# release -> desktop (Windows, macOS) -> latest-json
#         -> android (after desktop)
# The draft release exists before any build uploads, so concurrent jobs cannot
# each create one. latest.json has a single writer that runs after every
# desktop build has uploaded.
jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.names.outputs.version }}
      windows-stem: ${{ steps.names.outputs.windows }}
      macos-stem: ${{ steps.names.outputs.macos }}
      updater-args: ${{ steps.updater.outputs.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .ci/.nvmrc
      # Absent from tags cut before 2026-07-07; those trees carry their version
      # inline, so skipping the stamp is correct rather than fatal.
      - name: Stamp version from tag
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "$RELEASE_TAG"
          else
            echo "::notice::scripts/set-version.mjs absent at this tag; using the version committed in the tree."
          fi
      # Updater artifacts (minisign-signed installers and latest.json) need the
      # private key in secrets and the matching public key committed in
      # tauri.conf.json; tauri build fails when they are enabled without the
      # private key. Without both, installers still ship and installed apps are
      # not offered the release.
      - name: Resolve updater signing
        id: updater
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building installers without updater artifacts. Installed apps will not be offered this release."
          elif grep -q 'HARMONY_UPDATER_PUBKEY' src-tauri/tauri.conf.json; then
            echo "::warning::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder; building installers without updater artifacts."
          else
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Name release assets
        id: names
        # Assignments, not inline substitutions, so a failing helper fails the step.
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          windows=$(bash .ci/scripts/name-artifact.sh --release Windows release)
          macos=$(bash .ci/scripts/name-artifact.sh --release macOS release)
          {
            echo "version=$version"
            echo "windows=$windows"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"
      # Also deletes a latest.json left by an earlier run of this tag, so the
      # release carries one only when this run's builds all uploaded.
      - name: Find or draft the release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          node .ci/scripts/github-release.mjs ensure --tag "$RELEASE_TAG" \
            --name "Harmony $VERSION" --body "Download the installer for your platform below."

  # Proper signing/notarization needs paid certs as secrets — follow-up.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            stem: windows-stem
            platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            rust-targets: x86_64-pc-windows-msvc
          - name: macOS
            stem: macos-stem
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Stamp version from tag
        shell: bash
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "$RELEASE_TAG"
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$version" != "$EXPECTED" ]; then
            echo "::error::Tree version $version differs from the release job's $EXPECTED."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Uploads the installer and, with updater signing, its .sig (macOS: also
      # .app.tar.gz and .sig). latest.json is the latest-json job's.
      # assetNamePattern names every uploaded file: [ext] is the full suffix
      # (.exe, .exe.sig, .dmg, .app.tar.gz, .app.tar.gz.sig), so each .sig is
      # its payload's name plus .sig. With releaseId set the action neither
      # looks up nor creates a release. Pinned to v0.6.2: v1 renames the input
      # to releaseAssetNamePattern.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: false
          assetNamePattern: ${{ needs.release.outputs[matrix.stem] }}[ext]
          args: ${{ matrix.args }} ${{ needs.release.outputs.updater-args }}

  # The updater endpoint (releases/latest/download/latest.json) resolves only
  # to the newest published non-prerelease release, so publishing the draft is
  # the rollout. Skipped when a desktop build failed: the draft then has no
  # latest.json, and publishing it offers installed apps nothing.
  latest-json:
    name: Updater manifest
    needs: [release, desktop]
    if: needs.release.outputs.updater-args != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write latest.json from the release's assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          VERSION: ${{ needs.release.outputs.version }}
          WINDOWS: ${{ needs.release.outputs.windows-stem }}.exe
          MACOS: ${{ needs.release.outputs.macos-stem }}.app.tar.gz
        run: |
          node scripts/github-release.mjs latest-json --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" --version "$VERSION" --windows "$WINDOWS" --macos "$MACOS"

  android:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 28.2.13676358
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Stamp version from tag
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "$RELEASE_TAG"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The action's default package list includes `tools`, which cmdline-tools
      # 16.0 no longer carries; sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Secrets are passed via env, not inline ${{ }}, so quoting in a password
      # cannot break the shell. Whitespace is stripped before decoding: base64
      # -d rejects the whole input on a stray CR or wrapped line.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 release.keystore"
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # FCM is optional. Without the secret the APK still gets push through UnifiedPush and
      # shows notifications while running; app/build.gradle.kts applies the Google Services
      # plugin only when the file exists.
      - name: Configure Firebase Cloud Messaging
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 -d > google-services.json 2>/dev/null; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not valid base64. Regenerate it with: base64 -w 0 google-services.json"
            exit 1
          fi
          if ! node -e 'const j = require("./google-services.json"); process.exit((j.client || []).some(c => c.client_info?.android_client_info?.package_name === "online.knowmad.harmony") ? 0 : 1)' 2>/dev/null; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 decoded, but is not a google-services.json with an Android app for online.knowmad.harmony."
            exit 1
          fi

      - name: Note FCM absence
        if: env.HAS_GOOGLE_SERVICES != 'true'
        run: echo "::notice::No ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret - this APK has no FCM; push works through UnifiedPush only."

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --target aarch64

      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a debug-signed APK. Add signing secrets for proper release builds."
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --debug --target aarch64

      # Renamed in place, so the attach step's glob matches it.
      - name: Name APK
        run: |
          profile=$([ "$HAS_KEYSTORE" = true ] && echo release || echo debug)
          set -- src-tauri/gen/android/app/build/outputs/apk/universal/*/*.apk
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one APK, found: $*"
            exit 1
          fi
          bash .ci/scripts/name-artifact.sh --release Android "$profile" "$1"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/universal/*/*.apk
