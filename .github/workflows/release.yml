name: Release

# Publishes downloadable installers to a GitHub Release.
# Trigger: push a version tag (e.g. `git tag v1.4.0 && git push --tags`),
# or run manually and pass an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.4.0)"
        required: true

env:
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL != '' && secrets.TEST_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY != '' && secrets.TEST_SUPABASE_ANON_KEY || 'placeholder-key' }}

jobs:
  # Proper signing/notarization needs paid certs as secrets — follow-up.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            rust-targets: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # Absent from tags cut before 2026-07-07; those trees carry their version
      # inline, so skipping the stamp is correct rather than fatal.
      - name: Stamp version from tag
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"
          else
            echo "::notice::scripts/set-version.mjs absent at this tag; using the version committed in the tree."
          fi
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Updater artifacts (minisign-signed installers and latest.json) need the
      # private key in secrets and the matching public key committed in
      # tauri.conf.json; tauri build fails when they are enabled without the
      # private key. Without both, installers still ship and installed apps are
      # not offered the release.
      - name: Resolve updater signing
        id: updater
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building installers without updater artifacts. Installed apps will not be offered this release."
          elif grep -q 'HARMONY_UPDATER_PUBKEY' src-tauri/tauri.conf.json; then
            echo "::warning::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder; building installers without updater artifacts."
          else
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          fi
      # latest.json lands on this draft release. The updater endpoint
      # (releases/latest/download/latest.json) resolves only to the newest
      # published non-prerelease release, so publishing the draft is the
      # rollout.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Harmony __VERSION__
          releaseBody: Download the installer for your platform below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 28.2.13676358
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # Absent from tags cut before 2026-07-07; those trees carry their version
      # inline, so skipping the stamp is correct rather than fatal.
      - name: Stamp version from tag
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"
          else
            echo "::notice::scripts/set-version.mjs absent at this tag; using the version committed in the tree."
          fi
        shell: bash
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The action's default package list includes `tools`, which cmdline-tools
      # 16.0 no longer carries; sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Secrets are passed via env, not inline ${{ }}, so quoting in a password
      # cannot break the shell. Whitespace is stripped before decoding: base64
      # -d rejects the whole input on a stray CR or wrapped line.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 release.keystore"
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # FCM is optional. Without the secret the APK still gets push through UnifiedPush and
      # shows notifications while running; app/build.gradle.kts applies the Google Services
      # plugin only when the file exists.
      - name: Configure Firebase Cloud Messaging
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cd src-tauri/gen/android/app
          if ! printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 -d > google-services.json 2>/dev/null; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not valid base64. Regenerate it with: base64 -w 0 google-services.json"
            exit 1
          fi
          if ! node -e 'const j = require("./google-services.json"); process.exit((j.client || []).some(c => c.client_info?.android_client_info?.package_name === "online.knowmad.harmony") ? 0 : 1)' 2>/dev/null; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 decoded, but is not a google-services.json with an Android app for online.knowmad.harmony."
            exit 1
          fi

      - name: Note FCM absence
        if: env.HAS_GOOGLE_SERVICES != 'true'
        run: echo "::notice::No ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret - this APK has no FCM; push works through UnifiedPush only."

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --target aarch64

      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - building a debug-signed APK. Add signing secrets for proper release builds."
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --debug --target aarch64

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/universal/*/*.apk

  # Linux runs the CEF runtime. The deb comes from the tauri CLI; the AppImage
  # from src-tauri/linux/package.sh, which pins the AppImage tooling that
  # tauri-bundler would otherwise download from moving branches. Built
  # alongside the other legs and published by linux-publish once they are done,
  # so a Linux failure never blocks the desktop installers or the APK.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # Absent from tags cut before 2026-07-07; those trees carry their version
      # inline, so skipping the stamp is correct rather than fatal.
      - name: Stamp version from tag
        run: |
          if [ -f scripts/set-version.mjs ]; then
            node scripts/set-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"
          else
            echo "::notice::scripts/set-version.mjs absent at this tag; using the version committed in the tree."
          fi
        shell: bash
      # cmake/ninja: cef-dll-sys builds the CEF C++ wrapper. patchelf, file,
      # strace, xvfb, xauth: quick-sharun. The runtime libraries are Chromium's,
      # for quick-sharun's trace run and the smoke test.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build file patchelf strace \
            libgtk-4-dev libssl-dev libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev libdbus-1-dev \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxkbcommon0 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            xvfb xauth dbus
      - name: Locate CEF and AppImage tool caches
        run: |
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"
          echo "CEF_TOOLS_DIR=$RUNNER_TEMP/linux-tools" >> "$GITHUB_ENV"
      # cef-dll-sys downloads the CEF distribution into CEF_PATH when missing.
      # The key follows tauri-runtime-cef's pinned cef crate. Tag runs restore
      # caches saved on the default branch, which tauri.yml's linux job fills.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-152.3.0+152.0.6-linux-x86_64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-tools
          key: linux-tools-${{ hashFiles('src-tauri/linux/package.sh') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Same guard as the desktop legs. `sign` gates package.sh, which re-signs
      # the deb after rewriting its control file and signs the AppImage.
      - name: Resolve updater signing
        id: updater
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building Linux packages without updater signatures."
          elif grep -q 'HARMONY_UPDATER_PUBKEY' src-tauri/tauri.conf.json; then
            echo "::warning::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder; building Linux packages without updater signatures."
          else
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb ${{ steps.updater.outputs.args }}
      # The build links against the extracted tree; the archive only inflates the
      # cache.
      - name: Drop the CEF archive
        run: rm -f "$CEF_PATH"/*/cef_binary_*.tar.bz2
      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: sh src-tauri/linux/package.sh src-tauri/target/release/bundle/deb/Harmony_*_amd64.deb
      # A clean ubuntu:24.04 installs the deb with only its declared Depends;
      # every library the payload links must then resolve.
      - name: Check deb dependencies
        run: |
          docker run --rm -v "$PWD/src-tauri/target/release/bundle/deb:/deb:ro" ubuntu:24.04 sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends /deb/Harmony_*_amd64.deb >/dev/null
            missing=$(ldd /usr/share/Harmony/harmony /usr/share/Harmony/*.so | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }'
      # The runner restricts unprivileged user namespaces through AppArmor, as
      # Ubuntu 23.10+ desktops do, so the AppImage runs Chromium unsandboxed; the
      # installed deb keeps the sandbox through its setuid chrome-sandbox.
      - name: Smoke test
        run: |
          sh src-tauri/linux/smoke-test.sh src-tauri/target/release/bundle/appimage/Harmony_*_amd64.AppImage
          sudo apt-get install -y --no-install-recommends ./src-tauri/target/release/bundle/deb/Harmony_*_amd64.deb
          SMOKE_SANDBOX=on sh src-tauri/linux/smoke-test.sh /usr/bin/harmony
      # One flat directory: upload-artifact roots a multi-path artifact at the
      # paths' common ancestor, which would nest the files under deb/ and appimage/.
      - name: Collect release files
        run: |
          mkdir -p linux-release
          cp src-tauri/target/release/bundle/deb/Harmony_*_amd64.deb* \
            src-tauri/target/release/bundle/appimage/Harmony_*_amd64.AppImage* linux-release/
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-linux
          path: linux-release/
          if-no-files-found: error

  # Runs after every other writer of the draft release is done: tauri-action
  # (desktop) and softprops (android) each read-modify-write the release, and
  # tauri-action rewrites latest.json. Gated on the Linux build only, so a failed
  # desktop or Android leg does not hold back the Linux assets.
  linux-publish:
    needs: [desktop, android, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: src-tauri/linux
      - uses: actions/download-artifact@v4
        with:
          name: harmony-linux
          path: linux-assets
      # The draft exists unless every desktop leg failed before tauri-action
      # created it.
      - name: Upload to the draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Harmony ${TAG#v}" \
              --notes "Download the installer for your platform below."
          gh release upload "$TAG" linux-assets/* --clobber
      # Only a signed AppImage can be offered to installed apps. Asset URLs use
      # the tag, like tauri-action's; a draft's own asset URLs are untagged-*
      # until it is published.
      - name: Add Linux to latest.json
        run: |
          set -- linux-assets/Harmony_*_amd64.AppImage.sig
          if [ ! -f "$1" ]; then
            echo "::warning::The AppImage is unsigned; latest.json keeps its other platforms only."
            exit 0
          fi
          appimage=$(basename "$1" .sig)
          mkdir -p updater
          gh release download "$TAG" --pattern latest.json --dir updater || true
          node src-tauri/linux/latest-json.mjs updater/latest.json "${TAG#v}" \
            "https://github.com/$GH_REPO/releases/download/$TAG/$appimage" "$1"
          gh release upload "$TAG" updater/latest.json --clobber
