# Static SPA server for the Harmony web image.
# TLS and federation routing belong to the proxy in front (self-host/Caddyfile);
# this serves the built Vue app, its /config.json and the SPA fallback.

# Vite emits hashed files flat under /assets/ as <name>-<8-char hash>.<ext>.
# Copies of public/assets/ sit in subdirectories there and carry no hash.
map $uri $harmony_cache_control {
    default                                          "public, max-age=86400";
    /index.html                                      "no-cache";
    /config.json                                     "no-cache";
    /service-worker.js                               "no-cache, no-store, must-revalidate";
    /manifest.json                                   "public, max-age=3600";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$"   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative: the scheme and port the client sees belong to the proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # add_header in a location drops these; only the relay location adds its own.
    add_header Cache-Control $harmony_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Written at container start by /docker-entrypoint.d/40-harmony-config.sh.
    # Absent, it is a 404 rather than index.html.
    location = /config.json {
        try_files $uri =404;
    }

    # YouTube relay (public/youtube-embed.html), framed by the native apps.
    location = /youtube-embed.html {
        add_header Cache-Control $harmony_cache_control;
        add_header Content-Security-Policy "frame-ancestors 'self' tauri://localhost http://tauri.localhost https://tauri.localhost" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # A missing chunk must 404: index.html served as JavaScript breaks the
    # page and lands in caches.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
