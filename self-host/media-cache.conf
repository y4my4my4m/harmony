# Public storage reads, cached on disk in front of Kong (docker-compose.yml media-cache).
# Caddy sends GET and HEAD of /storage/v1/object/public/* and
# /storage/v1/render/image/public/* here, message_media aside, the render Accept already
# pinned to WebP.
#
# An entry lives 10 minutes whatever storage's Cache-Control says (uploads carry a year): a
# boosted post's downloads come within minutes, and a file deleted in moderation or with its
# account stops being served within that window. Browsers still get storage's Cache-Control.
# A response storage marks no-store or private is never kept. proxy_cache_lock makes
# concurrent misses of one file wait for a single upstream fetch; past max_size the least
# recently used files go.

map $upstream_http_cache_control $media_no_store {
    ~*(no-store|private) 1;
    default 0;
}

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:16m max_size=2g inactive=10m use_temp_path=off;

server {
    listen 8080;
    server_tokens off;

    # Kong resolved per request: a Supabase stack restarted after this one changes its address.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $kong supabase-kong:8000;

    location / {
        proxy_pass http://$kong;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache media;
        proxy_cache_key $request_uri;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 10m;
        proxy_no_cache $media_no_store;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        # Stale copies cover an unreachable storage only: a stale copy served while
        # revalidating would outlive a deletion.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
