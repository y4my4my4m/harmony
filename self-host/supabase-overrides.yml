# Harmony's changes to the upstream Supabase stack in ./supabase, merged over its
# docker-compose.yml by the `include:` in docker-compose.yml. The upstream files
# stay unmodified, so configure.sh --refresh-supabase replaces them wholesale.
#
# Requires Docker Compose 2.24.4 or later (include with a file list, !reset).

services:
  # Edge runtime: federation runs as its own Node service.
  # Supavisor: the federation listener connects to db directly as
  # harmony_listener; supavisor would also publish Postgres on the host.
  # A profile no command enables keeps both defined and never started.
  functions:
    profiles: [supabase-unused]
  supavisor:
    profiles: [supabase-unused]

  # Caddy reaches Kong as supabase-kong:8000 on the shared network; Logflare
  # has no public role. Only Caddy publishes ports.
  kong:
    ports: !reset []
  analytics:
    ports: !reset []

  # PostgREST copies its app settings into every request transaction; with this
  # one, any SQL run through the API can read the JWT secret as
  # current_setting('app.settings.jwt_secret'). No function reads it.
  rest:
    environment:
      PGRST_APP_SETTINGS_JWT_SECRET: !reset null

  # Animated emoji and large images: frames count toward the source resolution
  # limit (megapixels).
  imgproxy:
    environment:
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 120

  # Sign-in with Google, GitHub or Twitch: set <PROVIDER>_ENABLED=true,
  # <PROVIDER>_CLIENT_ID and <PROVIDER>_SECRET in supabase/.env. The provider's
  # callback URL is API_EXTERNAL_URL/auth/v1/callback (https://db.DOMAIN/...).
  # Admin, Instance, OAuth chooses which buttons the sign-in page shows.
  #
  # Sign-in with the instance's own OAuth 2.0 / OIDC providers: `harmony auth
  # add-provider`. GoTrue keeps them in auth.custom_oauth_providers.
  # Image: GOTRUE_IMAGE in supabase/.env, which configure.sh sets to the stack's
  # own image from v2.196.0 on and to v2.196.0 below it (the pinned upstream
  # stack runs v2.177.0); custom providers exist from 2.187.0, issuers with a
  # trailing slash (Authentik) work from 2.190.0, and JWKS with keys of other
  # algorithms from 2.196.0. Its own migrations bring the auth schema forward on
  # start.
  # GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: base of the custom providers' callback
  # (+ /callback); GoTrue defaults it to API_EXTERNAL_URL, which lacks Kong's
  # /auth/v1 prefix here.
  # PROVIDER_LINKING_DOMAINS in supabase/.env: provider=domain pairs, comma-separated.
  # A provider named there joins only accounts of its own domain, never an
  # account by email address; add-provider writes custom:ID=custom:ID. A value
  # GoTrue cannot parse stops it from starting.
  auth:
    image: ${GOTRUE_IMAGE:-supabase/gotrue:v2.196.0}
    environment:
      GOTRUE_CUSTOM_OAUTH_ENABLED: "true"
      GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXPERIMENTAL_PROVIDER_LINKING_DOMAINS: ${PROVIDER_LINKING_DOMAINS:-}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_TWITCH_ENABLED: ${TWITCH_ENABLED:-false}
      GOTRUE_EXTERNAL_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_TWITCH_SECRET: ${TWITCH_SECRET:-}
      GOTRUE_EXTERNAL_TWITCH_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
