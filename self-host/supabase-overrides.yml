# Harmony's changes to the upstream Supabase stack in ./supabase, merged over its
# docker-compose.yml by the `include:` in docker-compose.yml. The upstream files
# stay unmodified, so configure.sh --refresh-supabase replaces them wholesale.
#
# Requires Docker Compose 2.24.4 or later (include with a file list, !reset).

services:
  # Edge runtime: federation runs as its own Node service.
  # Supavisor: the federation listener connects to db directly as
  # harmony_listener; supavisor would also publish Postgres on the host.
  # A profile no command enables keeps both defined and never started.
  functions:
    profiles: [supabase-unused]
  supavisor:
    profiles: [supabase-unused]

  # Caddy reaches Kong as supabase-kong:8000 on the shared network; Logflare
  # has no public role. Only Caddy publishes ports.
  # Kong caches each upstream's address for the TTL of Docker's DNS answer
  # (600 s). An update recreates auth, storage and others together, and Docker
  # can hand them each other's freed addresses; Kong then answers 502 for that
  # service, sign-in included, until the entry expires: 6 min 42 s measured
  # after auth moved from .17 to .20. KONG_DNS_VALID_TTL bounds the cache.
  # 2.8.5, the last 2.8 release, in place of the stack's 2.8.1: same declarative
  # config format, Alpine 3.18 base in place of 3.16.
  kong:
    image: kong:2.8.5
    ports: !reset []
    depends_on:
      analytics: { condition: service_healthy, required: false }
    environment:
      KONG_DNS_VALID_TTL: 5

  # Supabase's log collection, Logflare (analytics) and vector, runs only under
  # the `logs` profile (ENABLE_ANALYTICS in .env, `harmony analytics on|off`).
  # Measured on a small production instance: Logflare 1.9 GB RSS, 2.78 GB of
  # logs in _supabase._analytics, and its replication slot holding 832 MB of WAL.
  # Upstream services wait for it; required: false starts them without it.
  # Without it, Studio's Logs pages are empty and `harmony logs` (Docker's own
  # logs) still shows every service.
  analytics:
    ports: !reset []
    profiles: [logs]
  vector:
    profiles: [logs]
  db:
    # Parallel VACUUM, CREATE INDEX and hash joins allocate shared memory in
    # /dev/shm, which Docker caps at 64 MB per container. A parallel VACUUM of a
    # 1 GB table asked for 67151776 bytes there and failed: "could not resize
    # shared memory segment ... No space left on device". tmpfs: memory is taken
    # only while in use.
    shm_size: 1g
    depends_on:
      vector: { condition: service_healthy, required: false }
  # Database UI. Studio and postgres-meta at upstream's 2026-11-06 releases in place of
  # the stack's 2025.06.30 / v0.91.0 (trivy HIGH+CRITICAL: Studio 1221 -> 275, meta 144 -> 82).
  # Studio from 2026 reads the database's address itself and listens on HOSTNAME;
  # meta keeps the stack's supabase_admin connection.
  # Both run only under the `studio` profile (ENABLE_STUDIO in .env, `harmony studio on|off`).
  # Kong serves Studio at the root of DB_DOMAIN behind basic-auth, with one shared password and no
  # rate-limiting plugin, and Studio's SQL editor reaches the whole database. No other service
  # depends on either; Kong answers 503 on their routes while they are absent.
  studio:
    profiles: [studio]
    image: supabase/studio:2026.11.02-sha-a05e7ec
    depends_on:
      analytics: { condition: service_healthy, required: false }
    environment:
      HOSTNAME: "0.0.0.0"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
  meta:
    profiles: [studio]
    image: supabase/postgres-meta:v0.100.0
    depends_on:
      analytics: { condition: service_healthy, required: false }
  # Image: REALTIME_IMAGE and STORAGE_IMAGE in supabase/.env, which configure.sh sets
  # to the stack's own image from REALTIME_MIN / STORAGE_MIN on and to that minimum
  # below it; the pinned upstream stack runs realtime v2.34.47 and storage-api v1.25.7,
  # both with published authorization bypasses. Each brings its own schema forward on
  # start. Realtime from v2.148 refuses to boot without METRICS_JWT_SECRET; upstream's
  # stack sets it to JWT_SECRET.
  # Realtime from v2.76 caps presence calls per client, by default 5 per 30 s; past the
  # cap a track gets no reply and no later one reaches the peer (measured on v2.148.3:
  # the sixth and every later call within 50 s). Typing indicators track twice per
  # burst, on and off after 3 s idle (TypingIndicatorService), so up to 20 calls in 30 s
  # from one context.
  realtime:
    image: ${REALTIME_IMAGE:-supabase/realtime:v2.148.3}
    depends_on:
      analytics: { condition: service_healthy, required: false }
    environment:
      METRICS_JWT_SECRET: ${JWT_SECRET}
      CLIENT_PRESENCE_MAX_CALLS: "60"
      CLIENT_PRESENCE_WINDOW_MS: "30000"

  # PostgREST copies its app settings into every request transaction; with this
  # one, any SQL run through the API can read the JWT secret as
  # current_setting('app.settings.jwt_secret'). No function reads it.
  rest:
    depends_on:
      analytics: { condition: service_healthy, required: false }
    environment:
      PGRST_APP_SETTINGS_JWT_SECRET: !reset null

  # Largest object storage-api accepts, bytes, TUS included: the upload ceiling.
  # `harmony config --upload-ceiling SIZE` sets FILE_SIZE_LIMIT in supabase/.env,
  # recreates storage and writes the same number into
  # instance_config.upload_ceiling_bytes, above which no upload limit goes.
  storage:
    image: ${STORAGE_IMAGE:-supabase/storage-api:v1.89.12}
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}

  # Animated emoji and large images: frames count toward the source resolution
  # limit (megapixels). v4.0.21, upstream's release with storage-api v1.89.12, in place
  # of the stack's v3.8.0: it decodes every uploaded image. v4 drops the
  # IMGPROXY_ENABLE_WEBP_DETECTION name the stack sets; IMGPROXY_AUTO_WEBP carries its value.
  # From v3.12 a source outside IMGPROXY_PREFERRED_FORMATS (default jpeg,png,gif) is
  # re-encoded when the request names no format and the client does not take WebP:
  # WebP became JPEG (alpha lost) and animated WebP became GIF. webp and avif in the
  # list keep them, as v3.8 did.
  imgproxy:
    image: darthsim/imgproxy:v4.0.21
    environment:
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
      IMGPROXY_PREFERRED_FORMATS: jpeg,png,gif,webp,avif
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_MAX_ANIMATION_FRAMES: 120

  # Sign-in with Google, GitHub or Twitch: set <PROVIDER>_ENABLED=true,
  # <PROVIDER>_CLIENT_ID and <PROVIDER>_SECRET in supabase/.env. The provider's
  # callback URL is API_EXTERNAL_URL/auth/v1/callback (https://db.DOMAIN/...).
  # Admin, Instance, OAuth chooses which buttons the sign-in page shows.
  #
  # Sign-in with the instance's own OAuth 2.0 / OIDC providers: `harmony auth
  # add-provider`. GoTrue keeps them in auth.custom_oauth_providers.
  # Image: GOTRUE_IMAGE in supabase/.env, which configure.sh sets to the stack's
  # own image from v2.197.0 on and to v2.197.0 below it (the pinned upstream
  # stack runs v2.177.0); custom providers exist from 2.187.0, issuers with a
  # trailing slash (Authentik) work from 2.190.0, and JWKS with keys of other
  # algorithms from 2.196.0. Its own migrations bring the auth schema forward on
  # start.
  # GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: base of the custom providers' callback
  # (+ /callback); GoTrue defaults it to API_EXTERNAL_URL, which lacks Kong's
  # /auth/v1 prefix here.
  # PROVIDER_LINKING_DOMAINS in supabase/.env: provider=domain pairs, comma-separated.
  # A provider named there joins only accounts of its own domain, never an
  # account by email address; add-provider writes custom:ID=custom:ID. A value
  # GoTrue cannot parse stops it from starting.
  #
  # Invitation and password reset emails: GoTrue fetches each template over HTTP
  # (GOTRUE_MAILER_TEMPLATES_*) and falls back to its own when the fetch fails.
  # The web image serves Harmony's (public/email-templates/), whose link opens
  # SITE_URL/reset-password with the token hash; the page redeems it when the
  # password is submitted. GoTrue's own link is a GET of /auth/v1/verify, which
  # spends the token for the first fetcher, mail scanners included.
  # MAILER_TEMPLATES_INVITE / MAILER_TEMPLATES_RECOVERY in supabase/.env replace them.
  #
  # Client address: with GOTRUE_SECURITY_SB_FORWARDED_FOR_ENABLED GoTrue's per-IP limiters and
  # hook metadata read Sb-Forwarded-For, which Caddy overwrites on DB_DOMAIN. Kong 2.8.5 forwards
  # it unchanged, replaces X-Real-IP with its peer and appends to X-Forwarded-For, whose first
  # value (what GoTrue otherwise reads) a client chooses. The header turns on GoTrue's per-IP limits
  # on sign-in, /verify, /recover, /otp and MFA; without it they do not run, which is what a
  # request of the instance's own services, a private client and a token refresh get.
  # GOTRUE_RATE_LIMIT_HEADER is unset: it applies only without the header. Limits per address are
  # GoTrue's defaults; RATE_LIMIT_OTP also sets recover, resend, magic link, OTP and PUT /user.
  # RATE_LIMIT_EMAIL_SENT: one budget per hour for all mail of the instance (mail.go sendEmail, when
  # autoconfirm is off), default 30, so one burst blocks other people's confirmations and resets. 28
  # sign-ups in one hour were measured on prod.
  # Hook: public.before_user_created_hook (20261109100001), which refuses sign-ups by the limits
  # in Admin, Invites. update.sh migrates before it recreates this service; a missing
  # function fails every sign-up.
  auth:
    image: ${GOTRUE_IMAGE:-supabase/gotrue:v2.197.0}
    depends_on:
      analytics: { condition: service_healthy, required: false }
    environment:
      GOTRUE_SECURITY_SB_FORWARDED_FOR_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/before_user_created_hook
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${RATE_LIMIT_EMAIL_SENT:-100}
      GOTRUE_CUSTOM_OAUTH_ENABLED: "true"
      GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXPERIMENTAL_PROVIDER_LINKING_DOMAINS: ${PROVIDER_LINKING_DOMAINS:-}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_TWITCH_ENABLED: ${TWITCH_ENABLED:-false}
      GOTRUE_EXTERNAL_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_TWITCH_SECRET: ${TWITCH_SECRET:-}
      GOTRUE_EXTERNAL_TWITCH_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_MAILER_TEMPLATES_INVITE: ${MAILER_TEMPLATES_INVITE:-http://web/email-templates/invite.html}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${MAILER_TEMPLATES_RECOVERY:-http://web/email-templates/recovery.html}
