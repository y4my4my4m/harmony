# =============================================================================
# Harmony - all-in-one self-host stack
# =============================================================================
#   ./harmony install        # or: bash install.sh - asks, configures, starts
#
# By hand:
#   bash configure.sh        # writes .env, federation.env, supabase/ ...
#   docker compose pull      # Harmony images from ghcr.io at HARMONY_VERSION
#   docker compose up -d
#   bash bootstrap.sh        # loads the database schema
#   ./harmony admin create   # the instance admin
#
# Updates: ./harmony update. Optional services are compose profiles (voice,
# bots, discord); configure.sh lists the enabled ones in COMPOSE_PROFILES in .env.
#
# Harmony's own services run published images. HARMONY_BUILD=1 configure.sh
# adds docker-compose.build.yml through COMPOSE_FILE in .env, which builds
# them from this checkout instead.
#
# Supabase comes in through `include:` from ./supabase, the upstream
# supabase/supabase docker/ directory at the commit configure.sh pins, with
# supabase-overrides.yml merged over it. Everything shares the `harmony`
# network, so service and container names resolve between the two.
#
# Requires Docker Compose 2.24.4 or later.
# =============================================================================

name: harmony

include:
  - path:
      - ./supabase/docker-compose.yml
      - ./supabase-overrides.yml
    env_file: ./supabase/.env

services:
  # ---------------------------------------------------------------------------
  # Caddy - reverse proxy + automatic HTTPS; the only service with public ports
  # (LiveKit's media ports aside).
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: harmony-caddy
    restart: unless-stopped
    # HARMONY_HTTP_PORT / HARMONY_HTTPS_PORT: [address:]port on the host.
    # Let's Encrypt validates through 80 and 443 on the public address.
    ports:
      - "${HARMONY_HTTP_PORT:-80}:80"
      - "${HARMONY_HTTPS_PORT:-443}:443"
      - "${HARMONY_HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      DB_DOMAIN: ${DB_DOMAIN:-db.${DOMAIN}}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-live.${DOMAIN}}
      # A contact email (public ACME) or "internal" (Caddy's own CA).
      CADDY_TLS: ${CADDY_TLS:-internal}
      # true defines the LiveKit site; false leaves its domain without one.
      ENABLE_VOICE: ${ENABLE_VOICE:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - federation-server
    networks:
      default:
      # The public domain resolves to Caddy on this network, so a service on it
      # reaches https://DOMAIN without hairpin NAT or public DNS. The alias is
      # absent from the default network: the federation backend's SSRF guard
      # keeps seeing the public address for its own domain.
      selfcall:
        aliases:
          - ${DOMAIN}

  # ---------------------------------------------------------------------------
  # Frontend (Vue SPA). The entrypoint writes /config.json from this
  # environment; a change needs `docker compose up -d`, no rebuild.
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/y4my4my4m/harmony-web:${HARMONY_VERSION:-edge}
    container_name: harmony-web
    restart: unless-stopped
    environment:
      SUPABASE_URL: https://${DB_DOMAIN:-db.${DOMAIN}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env (configure.sh writes it)}
      DOMAIN: ${DOMAIN}
      INSTANCE_NAME: ${INSTANCE_NAME:-Harmony}
      APP_URL: https://${DOMAIN}
      # Comma-separated GoTrue provider ids (google, github, twitch) the
      # sign-in page offers; each also needs its GOTRUE_EXTERNAL_* settings.
      ENABLED_OAUTH_PROVIDERS: ${ENABLED_OAUTH_PROVIDERS:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Federation backend - server (HTTP) and worker (queues) from one image
  # ---------------------------------------------------------------------------
  federation-server:
    image: ghcr.io/y4my4my4m/harmony-federation:${HARMONY_VERSION:-edge}
    container_name: harmony-federation-server
    restart: unless-stopped
    env_file:
      - ./federation.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      FEDERATION_MODE: server
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - default

  federation-worker:
    image: ghcr.io/y4my4my4m/harmony-federation:${HARMONY_VERSION:-edge}
    container_name: harmony-federation-worker
    restart: unless-stopped
    env_file:
      - ./federation.env
    environment:
      NODE_ENV: production
      FEDERATION_MODE: worker
    # Worker serves no HTTP; the image HEALTHCHECK probes :3001/health.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      federation-server:
        condition: service_started
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Redis - BullMQ job queue, caching, presence, rate limiting, LiveKit state
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: harmony-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Bot gateway (profile: bots)
  # ---------------------------------------------------------------------------
  bot-gateway:
    image: ghcr.io/y4my4my4m/harmony-bot-gateway:${HARMONY_VERSION:-edge}
    container_name: harmony-bot-gateway
    restart: unless-stopped
    env_file:
      # Written by configure.sh only with bots enabled.
      - path: ./bot-gateway.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3002"
    depends_on:
      - federation-server
    networks:
      - default
      # FEDERATION_BACKEND_URL is https://DOMAIN: the gateway sends its secret
      # only over https or to localhost.
      - selfcall
    profiles: [bots]

  # ---------------------------------------------------------------------------
  # Discord bridge hosting (profile: discord, needs bots)
  # ---------------------------------------------------------------------------
  # Runs every community's hosted bridge (Server Settings, Discord Bridge,
  # hosted mode) once an admin enables hosting in Admin, Instance. Talks to
  # the gateway on the compose network; BRIDGE_HOST_SECRET equals the
  # gateway's (bot-gateway.env). Its image versions separately from Harmony.
  discord-bridge-host:
    image: ghcr.io/y4my4my4m/harmony-discord-bridge:${DISCORD_BRIDGE_VERSION:-2}
    container_name: harmony-discord-bridge-host
    restart: unless-stopped
    env_file:
      # Written by configure.sh only with Discord bridge hosting enabled.
      - path: ./discord-bridge.env
        required: false
    environment:
      BRIDGE_MODE: host
      HARMONY_URL: http://bot-gateway:3002
      HARMONY_PUBLIC_URL: https://${DOMAIN}
    volumes:
      - discord-bridge-data:/data
    depends_on:
      - bot-gateway
    networks:
      - default
    profiles: [discord]

  # ---------------------------------------------------------------------------
  # LiveKit voice/video (profile: voice)
  # ---------------------------------------------------------------------------
  # Signalling (7880) goes through Caddy at LIVEKIT_DOMAIN. Media uses the
  # ports below, livekit.yaml's rtc.tcp_port and rtc.udp_port (one UDP port,
  # multiplexed). The generated livekit.yaml leaves TURN off.
  livekit:
    image: livekit/livekit-server:v1.9.4
    container_name: harmony-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
    profiles: [voice]

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  discord-bridge-data:

networks:
  default:
    name: harmony
  selfcall:
