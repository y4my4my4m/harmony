# =============================================================================
# GoTrue client address for the Supabase API host (db.<domain>)
# =============================================================================
# http context: copy to /etc/nginx/conf.d/harmony-auth-client-ip.conf. In every location of the
# db.<domain> server block that proxies to Kong:
#
#   proxy_set_header Sb-Forwarded-For $harmony_sb_forwarded_for;
#
# A location with no proxy_set_header of its own inherits the server block's; the first one it
# adds drops those, so copy them in.
#
# With GOTRUE_SECURITY_SB_FORWARDED_FOR_ENABLED, GoTrue's per-IP limiters, its hook metadata and
# its request log read this header (supabase/auth v2.197.0 internal/sbff). Measured through Kong
# 2.8.5: Sb-Forwarded-For arrives unchanged, X-Real-IP is replaced by Kong's peer, and
# X-Forwarded-For gains Kong's peer at the end while GoTrue reads its first value, which a client
# chooses.
#
# $remote_addr must be the client: behind a CDN, restore it first with set_real_ip_from and
# real_ip_header. Overwriting matters: a client's own value otherwise reaches GoTrue.
#
# A token refresh carries no address, so no limiter runs on it. auth-js removes the session on a
# 429 there, and a refresh token cannot be guessed. Matching is exact and case-sensitive, as in
# Go's r.FormValue: any other query gets the address, and a form body naming another grant leaves
# no JSON body for the password grant to read.
# =============================================================================

map "$uri?$args" $harmony_sb_forwarded_for {
    default $remote_addr;
    "~^/auth/v1/token\?grant_type=refresh_token$" "";
}
