# =============================================================================
# Harmony LiveKit Nginx Configuration Template
# =============================================================================
# Terminates TLS for LiveKit WebSocket traffic on its own subdomain.
#
# Copy this to nginx-livekit.conf and replace placeholders:
#   - YOUR_DOMAIN: Your base domain (e.g., harmony.example.com)
#
# Then:
#   sudo certbot certonly -d live.YOUR_DOMAIN
#   sudo cp nginx-livekit.conf /etc/nginx/sites-available/harmony-livekit
#   sudo ln -s /etc/nginx/sites-available/harmony-livekit /etc/nginx/sites-enabled/
#   sudo systemctl reload nginx
#
# LiveKit itself listens on localhost:7880.
# =============================================================================

server {
    listen 80;
    server_name live.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name live.YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/live.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.YOUR_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://localhost:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket sessions are long-lived; 86400s = 24h.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    access_log /var/log/nginx/livekit.access.log;
    error_log /var/log/nginx/livekit.error.log;
}
