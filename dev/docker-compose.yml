version: "3.8"

# =============================================================================
# HARMONY LOCAL DEVELOPMENT ENVIRONMENT
# =============================================================================
# 
# This docker-compose provides:
# - Caddy reverse proxy with HTTPS (using mkcert certificates)
# - Vite dev server proxied to https://har.mony.local
# - Federation backend proxied to https://har.mony.local/api
# - LiveKit proxied to wss://live.mony.local
#
# SETUP:
# 1. Install mkcert: https://github.com/FiloSottile/mkcert
#    - brew install mkcert (macOS)
#    - sudo pacman -S mkcert (Arch/Manjaro)
#    - sudo apt install mkcert (Debian/Ubuntu with backports)
#
# 2. Install the local CA:
#    mkcert -install
#
# 3. Generate certificates:
#    cd dev/certs
#    mkcert "har.mony.local" "live.mony.local" localhost 127.0.0.1
#
# 4. Add to /etc/hosts:
#    127.0.0.1 har.mony.local live.mony.local
#
# 5. Start the stack:
#    cd dev && docker compose up -d
#
# 6. Run Vite dev server (in another terminal):
#    npm run dev -- --host 0.0.0.0
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # CADDY - Reverse Proxy with HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: harmony-dev-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - harmony-dev
      - supabase_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # FEDERATION BACKEND (optional - can also run with npm run dev)
  # ---------------------------------------------------------------------------
  # Uncomment to run federation-backend in Docker instead of locally
  # federation-backend:
  #   build:
  #     context: ../federation-backend
  #     dockerfile: Dockerfile.dev
  #   container_name: harmony-dev-backend
  #   restart: unless-stopped
  #   env_file:
  #     - ../federation-backend/.env
  #   volumes:
  #     - ../federation-backend/src:/app/src:ro
  #   networks:
  #     - harmony-dev
  #     - supabase_default
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

networks:
  harmony-dev:
    driver: bridge
  supabase_default:
    external: true

volumes:
  caddy-data:
  caddy-config:

