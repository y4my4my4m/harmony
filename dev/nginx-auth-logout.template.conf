# =============================================================================
# GoTrue /logout: local scope only
# =============================================================================
# Include inside the server block of the Supabase API host (db.<domain>), above
# its locations:
#
#   server {
#       server_name db.example.com;
#       include /etc/nginx/snippets/harmony-auth-logout.conf;
#       location / { proxy_pass http://127.0.0.1:8000; ... }
#   }
#
# GoTrue's POST /logout accepts any valid access token, aal1 included, and its
# global and others scopes delete every session of the account. A password
# without the second factor would sign every device out. Only ?scope=local
# passes; a missing scope is GoTrue's global default and is refused.
# Signing out other devices goes through public.sign_out_my_sessions(), which
# requires aal2 when the account has a verified factor
# (db_schema/migrations/20261007500001_sign_out_scope.sql).
#
# The match runs on $uri, which nginx has percent-decoded, slash-merged and
# dot-segment-resolved, so an encoded or padded path cannot slip past to Kong.
# OPTIONS passes for the CORS preflight. The refusal is GoTrue-shaped JSON with
# CORS headers; auth-js treats a 403 AuthApiError from /logout as signed out
# and clears the local session, so released clients that send scope=global end
# with a local sign-out.
#
# Kong (supabase kong.yml) cannot do this: 2.8 routes match path, host, method
# and headers but not the query string; the enabled plugins have no scripting,
# and request-transformer could only rewrite the scope silently. kong.yml is
# also replaced on every Supabase update.
#
# Deploy:
#   cp dev/nginx-auth-logout.template.conf /etc/nginx/snippets/harmony-auth-logout.conf
#   add the include to the db.<domain> server block (443 listener)
#   nginx -t && systemctl reload nginx
# Check, with any anon key (expect 403 logout_scope_forbidden for the first two,
# 401/403 from GoTrue for the third, which reached it):
#   curl -si -X POST 'https://db.example.com/auth/v1/logout?scope=global' -H "apikey: $ANON"
#   curl -si -X POST 'https://db.example.com/auth/v1/logout' -H "apikey: $ANON"
#   curl -si -X POST 'https://db.example.com/auth/v1/logout?scope=local' -H "apikey: $ANON"
# Kong's port (8000) and GoTrue's (9999) must not be reachable from outside;
# either bypasses this check.
# =============================================================================

set $harmony_logout "$request_method $uri ?$args";
if ($harmony_logout ~* "^(?!OPTIONS )[A-Z]+ /auth/v1/+logout/* \?(?!scope=local$)") {
    rewrite ^ /__harmony_logout_scope_forbidden last;
}

location = /__harmony_logout_scope_forbidden {
    internal;
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 403 '{"code":403,"error_code":"logout_scope_forbidden","msg":"Only this device can be signed out here. Sign out other devices from Settings, Sessions."}';
}
