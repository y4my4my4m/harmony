services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: harmony-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # The ports livekit.yaml.example listens on.
    ports:
      # port: signalling (WebSocket/HTTP), behind the TLS proxy
      - "7880:7880"
      # rtc.udp_port: all media on one UDP port (UDP mux)
      - "7882:7882/udp"
      # rtc.tcp_port: ICE over TCP when UDP is blocked
      - "7881:7881/tcp"
      # turn.udp_port
      - "3478:3478/udp"
      # turn.tls_port, when set
      # - "5349:5349/tcp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - harmony-webrtc
      - supabase_default # So federation-backend can reach LiveKit
    depends_on:
      - redis
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:7880/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: harmony-livekit-redis
    restart: unless-stopped
    # SECURITY: Always set a strong password in production!
    command: redis-server --requirepass YOUR_REDIS_PASSWORD_HERE
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost for security
    volumes:
      - redis-data:/data
    networks:
      - harmony-webrtc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YOUR_REDIS_PASSWORD_HERE", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Egress service for recording/streaming (stage events)
  livekit-egress:
    image: livekit/egress:latest
    container_name: harmony-livekit-egress
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - egress-recordings:/recordings
    networks:
      - harmony-webrtc
    depends_on:
      - livekit
    profiles:
      - egress # Only starts with --profile egress

networks:
  harmony-webrtc:
    driver: bridge
  # Connect to supabase network so federation-backend can reach LiveKit
  supabase_default:
    external: true

volumes:
  redis-data:
  egress-recordings:

