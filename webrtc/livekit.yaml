# LiveKit Server Configuration for Harmony
# See: https://docs.livekit.io/realtime/self-hosting/deployment/

# Port for WebSocket and HTTP connections
port: 7880

# API keys for authentication
# Format: key: secret
# Generate with: openssl rand -hex 32
keys:
  devkey: secret

# Logging
log_level: info

# RTC (WebRTC) Settings
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_ice_lite: true

# TURN Server (NAT Traversal)
turn:
  enabled: true
  domain: localhost
  udp_port: 3478

# Room Settings
room:
  empty_timeout: 300
  departure_timeout: 20

# Redis (for multi-node)
redis:
  address: redis:6379
